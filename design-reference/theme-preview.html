<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tempus — Theme Preview</title>
  <!-- Pulls the real tokens so this preview stays in sync with the source -->
  <link rel="stylesheet" href="./tempus-tokens.css">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0e0f13;
      color: #e4e6eb;
      padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #8b92a0; font-size: 13px; margin: 0 0 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }
    /* Each theme panel paints itself with the theme's own tokens */
    .theme {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow-lg);
    }
    .theme-name {
      font-size: var(--font-size-sm);
      font-weight: 700;
      letter-spacing: .02em;
      margin: 0 0 2px;
    }
    .theme-accent { font-size: 11px; color: var(--muted); margin: 0 0 14px; font-variant-numeric: tabular-nums; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow-md);
    }
    .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
    .card .value { font-size: var(--font-size-xl); font-weight: 700; margin: 0; }
    .card .delta { font-size: 12px; color: var(--success); margin: 4px 0 0; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .btn {
      background: var(--primary); color: #fff; border: none;
      border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .chip {
      background: var(--primary-soft-bg); border: 1px solid var(--primary-soft-border);
      color: var(--primary-soft-text); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
    }
    .badge { border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 600; border: 1px solid; }
    .badge.ok   { background: var(--badge-success-bg); border-color: var(--badge-success-border); color: var(--badge-success-text); }
    .badge.warn { background: var(--badge-warn-bg);    border-color: var(--badge-warn-border);    color: var(--badge-warn-text); }
    .badge.err  { background: var(--badge-error-bg);   border-color: var(--badge-error-border);   color: var(--badge-error-text); }
    input.field {
      width: 100%; box-sizing: border-box; background: var(--surface-subtle);
      border: 1px solid var(--border); border-radius: 10px; color: var(--text);
      font-size: 13px; padding: 9px 11px; margin-top: 12px; outline: none;
    }
    input.field:focus { box-shadow: 0 0 0 3px var(--focus-ring); border-color: var(--primary); }
    .swatches { display: flex; gap: 6px; margin-top: 12px; }
    .sw { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); }
    .muted-text { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <h1>Tempus — Theme Preview</h1>
  <p class="sub">All themes rendered from <code>tempus-tokens.css</code>. KPI card · primary/ghost buttons · soft chip · status badges · focusable input · core swatches.</p>
  <div class="grid" id="grid"></div>

  <script>
    const themes = [
      ['ts-theme-dark',        'Dark (default)',  '#136f63 teal'],
      ['ts-theme-light',       'Light',           '#2563eb blue'],
      ['ts-theme-rose',        'Rose',            '#d16b86 pink'],
      ['ts-theme-og',          'OG',              '#f97316 orange'],
      ['ts-theme-sierra117',   'Sierra 117',      '#6ba043 green'],
      ['ts-theme-protanopia',  'Protanopia',      '#00b4d8 cyan'],
      ['ts-theme-deuteranopia','Deuteranopia',    '#8b5cf6 violet'],
      ['ts-theme-tritanopia',  'Tritanopia',      '#ec4899 pink'],
      ['ts-theme-monochrome',  'Monochrome',      '#d4d4d4 grey'],
    ];
    const panel = (cls, name, accent) => `
      <div class="theme ${cls}">
        <p class="theme-name">${name}</p>
        <p class="theme-accent">primary ${accent}</p>
        <div class="card">
          <p class="label">Billed this month</p>
          <p class="value">$12,480</p>
          <p class="delta">▲ 8.2% on pace</p>
        </div>
        <div class="row">
          <button class="btn">Log hours</button>
          <button class="btn ghost">Export</button>
          <span class="chip">On pace</span>
        </div>
        <div class="row">
          <span class="badge ok">Paid</span>
          <span class="badge warn">Due soon</span>
          <span class="badge err">Overdue</span>
        </div>
        <input class="field" placeholder="Search contracts… (focus me)">
        <div class="swatches">
          <div class="sw" style="background:var(--primary)" title="--primary"></div>
          <div class="sw" style="background:var(--success)" title="--success"></div>
          <div class="sw" style="background:var(--warning)" title="--warning"></div>
          <div class="sw" style="background:var(--danger)" title="--danger"></div>
          <div class="sw" style="background:var(--panel)" title="--panel"></div>
          <div class="sw" style="background:var(--surface-subtle)" title="--surface-subtle"></div>
        </div>
        <p class="muted-text">Secondary / muted text sample.</p>
      </div>`;
    document.getElementById('grid').innerHTML = themes.map(t => panel(...t)).join('');
  </script>
</body>
</html>
