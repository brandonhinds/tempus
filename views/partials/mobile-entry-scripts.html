      }
      setLoading(false);
    };

    // Stamp the template's comment onto the day (desktop parity: applying a template overwrites the day
    // note). Comment records never enter the mobile cache, so this is fire-and-forget against the server:
    // add, and on duplicate look up the existing record's id from a fresh day read and update that.
    const stampTemplateComment = async (dateIso, comment) => {
      const text = (comment || '').trim();
      if (!text) return;
      const res = await run('api_addEntry', { date: dateIso, contract_id: '', entry_type: 'comment', note: text, punches_json: '[]' });
      if (!res || res.success || res.error !== 'duplicate_entry') return;
      const rows = await run('api_getEntries', { startDate: dateIso, endDate: dateIso }) || [];
      const existing = rows.find((e) => e && e.entry_type === 'comment');
      if (!existing || (existing.note || '') === text) return;
      await run('api_updateEntry', { id: existing.id, date: dateIso, contract_id: '', entry_type: 'comment', note: text, punches_json: '[]' });
    };

    // Hours entry: a tappable display backed by an in-app keypad (no native keyboard → no GAS viewport
    // jump). The hidden #mobile-hours input stays the single source of truth so the save/draft paths are
    // unchanged; the keypad and the display both read/write through it.
    // The entry (if any) matching the form's current hour type + contract on the current date. Entries are
    // unique per (date, hour type, contract), so this is the single entry the Hours field reflects/edits.
    const findEntryForSelection = () => {
      const htId = state.selectedHourTypeId || defaultHourTypeId();
      const contractId = (dom.manualContract && dom.manualContract.value) || '';
      return (state.entries || []).find((e) => e && e.date === state.currentDate
        && (e.hour_type_id || defaultHourTypeId()) === htId
        && (e.contract_id || '') === contractId) || null;
    };
    // The big Hours number always shows what's logged for the current selection (0.0 if nothing yet).
    const syncHoursDisplay = () => {
      if (!dom.hoursVal) return;
      const entry = findEntryForSelection();
      const mins = entry ? roundDuration(Number(entry.duration_minutes) || 0, roundInterval()) : 0;
      dom.hoursVal.textContent = mins > 0 ? trimHours(formatHours(mins)) : '0.0';
    };

    let padBuffer = '';
    let padFresh = false; // a pre-filled value acts as "selected" — the first keypress replaces it
    const renderPad = () => { if (dom.padVal) dom.padVal.textContent = padBuffer || '0.0'; };
    const commitPad = () => {
      if (dom.hours) dom.hours.value = padBuffer;
      state.draftHours = padBuffer;
      syncHoursDisplay();
    };
    // The form is always an "add" form. Tapping the Hours field opens the keypad to add a new entry;
    // tapping an existing entry row opens it pre-filled to update that specific entry. Either way the
    // keypad's primary button is the only commit — there's no standalone Add/Update button on the form.
    const openKeypad = (entry) => {
      state.keypadEntry = entry || null;
      if (entry) {
        const mins = Number(entry.duration_minutes) || 0;
        padBuffer = mins ? String(parseFloat((mins / 60).toFixed(2))) : '';
      } else {
        // Add: always start blank. (Never read the stale hidden input — that lingered after a swipe-delete.)
        padBuffer = '';
      }
      padFresh = padBuffer !== '';
      renderPad();
      if (dom.keypadDone) dom.keypadDone.textContent = entry ? 'Update entry' : 'Add entry';
      if (dom.keypad) dom.keypad.style.display = 'flex';
    };
    const closeKeypad = () => { if (dom.keypad) dom.keypad.style.display = 'none'; };
    const saveFromKeypad = () => {
      const buf = padBuffer;
      const entry = state.keypadEntry;
      state.keypadEntry = null;
      closeKeypad();
      const n = parseFloat(buf);
      if (!isFinite(n) || n <= 0) return;
      const minutes = Math.round(n * 60);
      if (minutes > 24 * 60) { setStatus('Hours must be within a single day.', 'error'); return; }
      const rounded = roundDuration(minutes, roundInterval());
      if (entry) {
        // Update just this entry's hours, keeping its own hour type + contract.
        saveEntry({
          id: entry.id,
          date: entry.date,
          punches: [{ in: '00:00', out: minutesToTime(rounded) }],
          duration_minutes: rounded,
          contract_id: entry.contract_id,
          hour_type_id: entry.hour_type_id,
          round_interval: roundInterval(),
          entry_type: 'basic'
        });
      } else {
        // New entry from the form's current hour type + contract.
        commitPad();
        saveEntry();
      }
    };
    const padPress = (key) => {
      if (padFresh) { padBuffer = ''; padFresh = false; }
      if (key === 'back') {
        padBuffer = padBuffer.slice(0, -1);
      } else if (key === '.') {
        if (padBuffer.indexOf('.') === -1) padBuffer += (padBuffer === '' ? '0.' : '.');
      } else {
        const dot = padBuffer.indexOf('.');
        if (dot !== -1 && padBuffer.length - dot > 2) return; // max 2 decimals
        if (padBuffer.replace('.', '').length >= 4) return;   // sensible overall length
        padBuffer += key;
      }
      renderPad();
      commitPad();
    };

    const setLoading = (flag) => {
      state.loading = flag;
      [dom.punchToggle, dom.punchEditorDone].forEach((el) => {
        if (!el) return;
        el.disabled = flag;
      });
    };

    const saveEntry = async (overridePayload) => {
      if (state.loading) return;
      const payload = overridePayload || (state.mode === 'punch' ? getPunchPayload() : getManualPayload());
      if (!payload) return;
      const duplicate = findDuplicate(payload);
      if (duplicate) {
        setStatus('An entry for this hour type already exists — tap it below to change it.', 'error');
        hydrateDraftFromEntry(null, { preserveMode: true });
        return;
      }
      setLoading(true);
      const isUpdate = !!payload.id;
      const fn = isUpdate ? 'api_updateEntry' : 'api_addEntry';
      const optimisticId = payload.id || ('temp_' + Date.now());
      const optimistic = sanitizeEntry({ ...payload, id: optimisticId, created_at: isoDateTime(new Date()) });
      // Optimistic: reflect the add OR update instantly (storeEntries upserts by id). Stay on a blank
      // add-form; the entry lives in the list below.
      const savedDate = state.currentDate;
      storeEntries([optimistic]);
      state.entries = getCachedEntriesForDate(savedDate);
      hydrateDraftFromEntry(null, { preserveMode: true });
      renderDayCard();
      const res = await run(fn, payload);
      if (res && res.success && res.entry) {
        const confirmed = sanitizeEntry(res.entry);
        if (!isUpdate) {
          // Drop the temp placeholder before storing the server id (temp id != real id → would double up).
          state.entryCache[savedDate] = getCachedEntriesForDate(savedDate).filter((e) => e.id !== optimisticId);
        }
        storeEntries([confirmed]);
        setStatus('Saved.', 'success');
      } else {
        // No success response — but GAS can return null on a transient hiccup even after it persisted.
        // Re-read this day authoritatively from the server rather than blindly rolling back (which could
        // vanish a successfully-saved entry until reload). Only flag an error if the write truly didn't land.
        state.entryCache[savedDate] = [];
        await fetchEntriesRange(savedDate, savedDate);
        const after = getCachedEntriesForDate(savedDate);
        const landed = isUpdate
          ? after.some((e) => e.id === payload.id)
          : after.some((e) => (e.hour_type_id || defaultHourTypeId()) === payload.hour_type_id
              && (e.contract_id || '') === (payload.contract_id || '')
              && Math.abs((Number(e.duration_minutes) || 0) - payload.duration_minutes) < 1);
        if (!landed) setStatus('Save failed. Please try again.', 'error');
      }
      if (state.currentDate === savedDate) {
        state.entries = getCachedEntriesForDate(savedDate);
        hydrateDraftFromEntry(null, { preserveMode: true });
        renderDayCard();
      }
      setLoading(false);
    };

    const deleteEntry = async () => {
      if (state.loading) return;
      if (!state.currentEntry) {
        setStatus('Nothing to delete.', 'error');
        return;
      }
      const id = state.currentEntry.id;
      if (typeof id === 'string' && id.indexOf('temp_') === 0) {
        // Never-persisted optimistic entry (e.g. left over from an earlier bug);
        // just drop it locally — the backend has nothing to delete.
        const filtered = getCachedEntriesForDate(state.currentDate).filter((e) => e.id !== id);
        state.entryCache[state.currentDate] = filtered;
        state.entries = filtered;
        state.currentEntry = null;
        hydrateDraftFromEntry(null, { preserveMode: true });
        renderDayCard();
        persistCache();
        setStatus('Removed.', 'success');
        return;
      }
      setLoading(true);
      setStatus('Deleting...', 'info');
      const res = await run('api_deleteEntry', id);
      if (res === null) {
        setStatus('Delete failed. Please try again.', 'error');
      } else {
        const filtered = getCachedEntriesForDate(state.currentDate).filter((e) => e.id !== id);
        state.entryCache[state.currentDate] = filtered;
        state.entries = filtered;
        state.currentEntry = null;
        state.draftHours = '';
        state.draftPunches = [{ in: '', out: '' }];
        state.punchDirty = false;
        hydrateDraftFromEntry(null, { preserveMode: true });
        renderDayCard();
        setStatus('Deleted.', 'success');
      }
      setLoading(false);
    };

    // ----- Theme picker (tap the Tempus brand). Sets a device-local theme that doesn't touch the synced
    // desktop setting, so mobile can run a different look. -----
    const MOBILE_THEME_KEY = 'ts_mobile_theme';
    const THEME_LABELS = {
      dark: 'Dark', light: 'Light', og: 'The OG', rose: 'Rose Gold', sierra117: 'Sierra 117',
      gizmodo: 'Gizmodo', blaze: 'Blaze', 'velvet-espresso': 'Velvet Espresso',
      protanopia: 'Protanopia', deuteranopia: 'Deuteranopia', tritanopia: 'Tritanopia', monochrome: 'Monochrome'
    };
    const getMobileThemeOverride = () => { try { return localStorage.getItem(MOBILE_THEME_KEY) || ''; } catch (e) { return ''; } };
    const currentThemeRef = () => getMobileThemeOverride() || ((mobileShell.state && mobileShell.state.settings && mobileShell.state.settings.theme) || 'dark');
    const buildThemeOptions = () => {
      const opts = ['dark', 'light', 'og', 'rose', 'sierra117', 'gizmodo', 'blaze', 'velvet-espresso'].map((k) => ({ key: k }));
      // Custom + accessibility (colour-blind) themes are always offered now — their feature flags are
      // retired (see RETIRED_FEATURE_FLAGS in scripts.html), so this mirrors the desktop theme gallery.
      let raw = mobileShell.state && mobileShell.state.settings ? mobileShell.state.settings.custom_themes : null;
      if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch (e) { raw = []; } }
      (Array.isArray(raw) ? raw : []).forEach((t) => { if (t && t.id) opts.push({ key: 'custom:' + t.id, label: t.name || 'Custom' }); });
      ['protanopia', 'deuteranopia', 'tritanopia', 'monochrome'].forEach((k) => opts.push({ key: k }));
      return opts.map((o) => ({ key: o.key, label: o.label || THEME_LABELS[o.key] || o.key }))
        .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }));
    };
    const applyMobileTheme = (key) => {
      try { localStorage.setItem(MOBILE_THEME_KEY, key); } catch (e) {}
      if (mobileShell.applyTheme) mobileShell.applyTheme(key);
    };
    const renderThemeList = () => {
      if (!dom.themeList) return;
      const current = currentThemeRef();
      dom.themeList.innerHTML = '';
      buildThemeOptions().forEach((opt) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'ts-m-theme-row' + (opt.key === current ? ' is-active' : '');
        const label = document.createElement('span');
        label.textContent = opt.label;
        row.appendChild(label);
        if (opt.key === current) {
          const tick = document.createElement('span');
          tick.className = 'ts-m-theme-tick';
          tick.textContent = '✓';
          row.appendChild(tick);
        }
        row.onclick = () => { applyMobileTheme(opt.key); renderThemeList(); closeThemeSheet(); };
        dom.themeList.appendChild(row);
      });
    };
    const openThemeSheet = () => { renderThemeList(); if (dom.themeSheet) dom.themeSheet.style.display = 'flex'; };
    const closeThemeSheet = () => { if (dom.themeSheet) dom.themeSheet.style.display = 'none'; };

    const bindEvents = () => {
      const selectMode = (mode) => {
        if (entryModeSource() === 'hour_type') {
          const desired = mode === 'punch' ? 'detailed' : 'simple';
          const current = state.hourTypeMap[state.selectedHourTypeId || defaultHourTypeId()];
          const compatible = current && hourTypeEffectiveEntryMode(current) === desired
            ? current
            : state.hourTypes.find((hourType) => hourTypeEffectiveEntryMode(hourType) === desired);
          if (compatible) {
            state.selectedHourTypeId = compatible.id;
            syncHourTypeSelects(compatible.id);
            renderContracts();
          }
        }
        setMode(mode);
      };
      if (dom.tabManual) dom.tabManual.onclick = () => selectMode('manual');
      if (dom.tabPunch) dom.tabPunch.onclick = () => selectMode('punch');
      if (dom.punchToggle) dom.punchToggle.onclick = togglePunch;
      if (dom.punchEditorDone) dom.punchEditorDone.onclick = () => {
        if (dom.punchEditorDone.dataset.mode === 'punchout') punchOutFromEditor();
        else savePunchEditor();
      };
      if (dom.punchEditor) dom.punchEditor.addEventListener('click', (event) => { if (event.target === dom.punchEditor) closePunchEditor(); });
      if (dom.themeTrigger) dom.themeTrigger.onclick = openThemeSheet;
      if (dom.themeSheet) dom.themeSheet.addEventListener('click', (event) => { if (event.target === dom.themeSheet) closeThemeSheet(); });
      if (dom.dateToday) dom.dateToday.onclick = () => hydrateDate(todayIso());
      if (dom.dateLabel) dom.dateLabel.onclick = openDatePicker;
      if (dom.dateMonthPrev) dom.dateMonthPrev.onclick = () => {
        if (state.datePicker.year == null || state.datePicker.month == null) return;
        const prev = new Date(state.datePicker.year, state.datePicker.month - 1, 1);
        state.datePicker.year = prev.getFullYear();
        state.datePicker.month = prev.getMonth();
        renderDatePicker();
      };
      if (dom.dateMonthNext) dom.dateMonthNext.onclick = () => {
        if (state.datePicker.year == null || state.datePicker.month == null) return;
        const next = new Date(state.datePicker.year, state.datePicker.month + 1, 1);
        state.datePicker.year = next.getFullYear();
        state.datePicker.month = next.getMonth();
        renderDatePicker();
      };
      if (dom.datePicker) {
        dom.datePicker.addEventListener('click', (event) => {
          if (event.target === dom.datePicker) closeDatePicker();
        });
      }
      if (dom.quickBtn) dom.quickBtn.onclick = openQuickSheet;
      if (dom.quickSheet) {
        dom.quickSheet.addEventListener('click', (event) => {
          if (event.target === dom.quickSheet) closeQuickSheet();
        });
      }
      if (dom.manualHourType) dom.manualHourType.onchange = () => selectHourType(dom.manualHourType.value);
      if (dom.punchHourType) dom.punchHourType.onchange = () => selectHourType(dom.punchHourType.value);
      if (dom.manualContract) dom.manualContract.onchange = () => { renderContracts({ manualPreferred: dom.manualContract.value }); syncHoursDisplay(); };
      if (dom.punchContract) dom.punchContract.onchange = () => { renderContracts({ punchPreferred: dom.punchContract.value }); updatePunchClock(); };
      if (dom.hoursDisplay) dom.hoursDisplay.onclick = () => openKeypad(findEntryForSelection());
      if (dom.keypadDone) dom.keypadDone.onclick = saveFromKeypad;
      if (dom.keypad) dom.keypad.addEventListener('click', (event) => { if (event.target === dom.keypad) closeKeypad(); });
      if (dom.padGrid) dom.padGrid.addEventListener('click', (event) => { const b = event.target.closest('[data-key]'); if (b) padPress(b.getAttribute('data-key')); });
      // Coming back to the tab revalidates everything the user may have changed elsewhere meanwhile:
      // contracts/hour types (forced — "I just made a contract on desktop" is exactly this moment) and
      // the current day's entries. Mobile Safari often resumes the page instead of reloading it, so
      // without this a stale view could linger indefinitely.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible' || !state.staticLoaded) return;
        refreshStaticFromServer({ force: true });
        refreshCurrentDayEntries();
      });
    };

    const init = async () => {
      run('api_getWebAppUrl').then((url) => {
        const desktopLink = document.getElementById('mobile-view-desktop-link');
        const viewSwitch = document.getElementById('mobile-view-switch');
        if (desktopLink && url) {
          desktopLink.href = url;
          // Remember the choice so auto-detect doesn't bounce a phone user
          // straight back to the mobile view (redirect loop).
          desktopLink.addEventListener('click', () => {
            try { localStorage.setItem('ts_view_pref', 'desktop'); } catch (e) {}
          });
          if (viewSwitch) viewSwitch.style.display = 'flex';
        }
      });
      bindEvents();
      await hydrateDate(todayIso());
      // Re-sync the theme from the SHELL's live state, not this module's snapshot — the snapshot is
      // captured at cache-time and goes stale once the shell's background refresh swaps in the fresh
      // settings, so applying it would re-slap the old theme over the new one (the flash-back bug).
      const liveSettings = (mobileShell.state && mobileShell.state.settings) || state.settings || {};
      if (mobileShell.applyTheme && liveSettings.theme) {
        mobileShell.applyTheme(liveSettings.theme);
      }
      applyDayModeChrome();
    };

    init();
  })();
</script>
