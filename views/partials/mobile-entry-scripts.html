      baby: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h.01M15 12h.01M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/></svg>',
      tool: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.1-2.1 2.5-2.5Z"/></svg>',
      cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z"/></svg>',
      pill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5a5 5 0 0 1-7-7l6-6a5 5 0 0 1 7 7Z"/><path d="M8.5 8.5l7 7"/></svg>',
      bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8v12M2 14h20v6M22 14v-2a3 3 0 0 0-3-3H10v5"/><circle cx="6" cy="11.5" r="1.5"/></svg>',
      users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>',
      laptop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 20h20"/></svg>',
      car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13M5 13h14v4H5Z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>',
      truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>',
      dollar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.6 7 6.5 9 9.5 12 10.5s5 1.6 5 4-2.2 3.5-5 3.5-5-1.1-5-3"/></svg>',
      flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4s2-1 5-1 5 2 8 2 3-1 3-1v10s-1 1-3 1-5-2-8-2-5 1-5 1"/></svg>',
      pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
      snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4 6l16 12M20 6 4 18M2 12h20"/></svg>',
      gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7S11 2 8.5 2 6 5 8 7M12 7s1-5 3.5-5S18 5 16 7"/></svg>',
      music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
      dumbbell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M3 9l3-3 2 2-3 3zM16 19l3-3-2-2-3 3zM6.5 6.5 4 4M17.5 17.5 20 20"/></svg>',
      leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 4 13c0-6 7-10 16-10 0 9-4 16-10 16-2 0-5-1-5-1M5 21c2-6 7-10 12-12"/></svg>',
      globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/></svg>',
      palette: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1 .9-1.5 2-1.5h2a4 4 0 0 0 4-4c0-5-4.5-10-9-10Z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16.5" cy="10.5" r="1"/></svg>'
    };
    const hourTypeIconSvg = (key) => HOUR_TYPE_ICONS[key] || HOUR_TYPE_ICONS.clock;

    const state = {
      currentDate: todayIso(),
      mode: 'manual',
      settings: {},
      featureFlags: {},
      contracts: [],
      hourTypes: [],
      hourTypeMap: {},
      entryCache: {},
      entries: [],
      draftHours: '',
      draftPunches: [{ in: '', out: '' }],
      currentEntry: null,
      selectedHourTypeId: '',
      loading: false,
      staticLoaded: false,
      prefetchedRange: null,
      cacheHydrated: false,
      punchDirty: false,
      datePicker: { year: null, month: null }
    };

    // The standard working day. Shared with desktop via the target_hours_per_day setting (falls back to
    // 7.5h). Read lazily so it tracks the setting once it's hydrated, rather than freezing at load time.
    const DEFAULT_TARGET_HOURS_PER_DAY = 7.5;
    const targetHoursPerDay = () => {
      const v = Number(state.settings ? state.settings.target_hours_per_day : NaN);
      return Number.isFinite(v) && v > 0 ? v : DEFAULT_TARGET_HOURS_PER_DAY;
    };
    const standardDayMinutes = () => targetHoursPerDay() * 60;

    // Scroll back to top after a delete. The real scroller inside the Apps Script sandbox is uncertain
    // (our container, the iframe document, or the cross-origin outer frame we can't touch), so try every
    // reachable candidate — whichever one actually owns the scroll wins.
    const scrollToTop = () => {
      const candidates = [
        document.querySelector('.ts-mobile-container'),
        document.scrollingElement,
        document.documentElement,
        document.body
      ];
      candidates.forEach((el) => {
        if (!el) return;
        try { if (el.scrollTo) el.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
        try { el.scrollTop = 0; } catch (e) {}
      });
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { try { window.scrollTo(0, 0); } catch (_) {} }
      const top = document.getElementById('mobile-entry');
      if (top && top.scrollIntoView) { try { top.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
    };

    let statusTimer = null;
    const setStatus = (message, tone = 'info') => {
      if (!dom.status) return;
      if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
      // In-progress chatter ("Saving…", "Deleting…", "Loading…") is silent since everything reflects
      // optimistically. We only speak up for a brief success confirmation ("Saved."/"Deleted.") or a
      // database-level failure. Success is transient; an error stays until the next action replaces it.
      const isError = tone === 'error';
      const isSuccess = tone === 'success';
      const show = (isError || isSuccess) && !!message;
      dom.status.textContent = show ? message : '';
      dom.status.className = 'ts-m-status' + (isError && show ? ' is-error' : '');
      if (show && isSuccess) {
        statusTimer = window.setTimeout(() => {
          dom.status.textContent = '';
          dom.status.className = 'ts-m-status';
          statusTimer = null;
        }, 2000);
      }
    };

    const formatDateLabel = (iso) => {
      const d = new Date(iso + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return '--';
      return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    };

    const formatDateSub = (iso) => {
      const d = new Date(iso + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return '';
      const today = new Date(todayIso() + 'T00:00:00');
      const deltaDays = Math.round((d - today) / 86400000);
      if (deltaDays === 0) return 'Today';
      if (deltaDays === -1) return 'Yesterday';
      if (deltaDays === 1) return 'Tomorrow';
      return String(d.getFullYear());
    };

    const trimHours = (value) => {
      const n = parseFloat(value);
      return Number.isFinite(n) ? String(n) : '0';
    };

    const formatDayNumber = (iso) => {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '--';
      return String(d.getDate());
    };

    const shiftIso = (iso, deltaDays) => {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return todayIso();
      d.setDate(d.getDate() + deltaDays);
      return d.toISOString().slice(0, 10);
    };

    const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
    const weekdayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    const defaultHourTypeId = () => {
      if (!state.hourTypes.length) return '';
      const preferred = state.hourTypes.find((ht) => ht.is_default);
      return (preferred || state.hourTypes[0]).id;
    };

    const hourTypesEnabled = () => {
      const flag = state.featureFlags.hour_types || {};
      return !!flag.enabled && state.hourTypes.length > 1;
    };

    const roundInterval = () => clampRoundInterval(state.settings ? state.settings.round_to_nearest : 0);

    const formatHours = (minutes) => {
      const total = Math.max(0, Math.round(Number(minutes) || 0));
      return (total / 60).toFixed(2);
    };

    // Archived contracts are excluded — you can't log new time against them — but they stay in
    // state.contracts so existing entries keep their name. Mirrors desktop's validContractsForDate.
    const validContractsForDate = (dateIso) => state.contracts.filter((c) => !c.archived && contractIsValid(c, dateIso));

    // Mirrors of desktop's entry-mode helpers (the two bundles don't share code beyond entryCore).
    // Settings chooses whether contracts or hour types own the Simple/Detailed override.
    const hourTypeNeedsContract = (ht) => !!ht && (!!ht.requires_contract || !!ht.contributes_to_income);
    const globalDefaultEntryMode = () =>
      (state.settings && state.settings.default_entry_mode === 'detailed') ? 'detailed' : 'simple';
    const entryModeSource = () =>
      (state.settings && state.settings.entry_mode_source === 'hour_type') ? 'hour_type' : 'contract';
    const hourTypeEffectiveEntryMode = (ht) => {
      const m = ht && ht.entry_mode;
      return (m === 'simple' || m === 'detailed') ? m : globalDefaultEntryMode();
    };
    const contractEffectiveEntryMode = (c) => {
      const m = c && c.entry_mode;
      if (m === 'simple' || m === 'detailed') return m;
      return globalDefaultEntryMode();
    };
    const validContractsForDateAndMode = (dateIso, mode, hourTypeId) => {
      const valid = validContractsForDate(dateIso);
      if (mode !== 'simple' && mode !== 'detailed') return valid;
      if (entryModeSource() === 'hour_type') {
        const ht = state.hourTypeMap[hourTypeId || defaultHourTypeId()];
        return hourTypeEffectiveEntryMode(ht) === mode ? valid : [];
      }
      return valid.filter((c) => contractEffectiveEntryMode(c) === mode);
    };

    const renderHourTypeSelect = (select) => {
      if (!select) return;
      select.innerHTML = '';
      state.hourTypes.forEach((ht) => {
        const opt = document.createElement('option');
        opt.value = ht.id;
        opt.textContent = ht.name || 'Work';
        select.appendChild(opt);
      });
    };

    const syncHourTypeSelects = (hourTypeId) => {
      const target = hourTypeId || defaultHourTypeId();
      if (dom.manualHourType) dom.manualHourType.value = target;
      if (dom.punchHourType) dom.punchHourType.value = target;
    };

    const renderHourTypes = () => {
      renderHourTypeSelect(dom.manualHourType);
      renderHourTypeSelect(dom.punchHourType);
      const shouldShow = hourTypesEnabled();
      if (!shouldShow) state.selectedHourTypeId = defaultHourTypeId();
      const selected = state.selectedHourTypeId || defaultHourTypeId();
      syncHourTypeSelects(selected);
      if (dom.manualHourTypeCol) dom.manualHourTypeCol.style.display = shouldShow ? 'block' : 'none';
      if (dom.punchHourTypeCol) dom.punchHourTypeCol.style.display = shouldShow ? 'block' : 'none';
    };

    // A contract only appears on the surface it's set up for (desktop parity): the Basic form writes
    // Simple entries so it lists Simple-mode contracts; the Punch form writes Sessions so it lists
    // Detailed-mode ones. `entryMode` picks the list.
    const renderContractsForSelect = (select, warningEl, hourTypeId, preferredContractId, entryMode) => {
      if (!select) return;
      const dateIso = state.currentDate;
      const hourType = state.hourTypeMap[hourTypeId || defaultHourTypeId()] || {};
      const needsContract = hourTypeNeedsContract(hourType);
      const valid = validContractsForDateAndMode(dateIso, entryMode, hourTypeId);
      select.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = needsContract ? 'Select contract' : 'No contract';
      select.appendChild(placeholder);
      valid.forEach((c) => {
        const option = document.createElement('option');
        option.value = c.id;
        option.textContent = c.name;
        select.appendChild(option);
      });
      const preferred = preferredContractId || '';
      const fallback = preferred && valid.some((c) => c.id === preferred) ? preferred : '';
      // Optional (non-contract) hour types default to "No contract"; required types keep auto-selecting a
      // contract as before so the field is never left empty when one is mandatory.
      select.value = fallback || (needsContract && valid[0] ? valid[0].id : '');
      select.disabled = needsContract && !valid.length;
      if (warningEl) warningEl.style.display = needsContract && !select.value ? 'block' : 'none';
    };

    const renderContracts = (opts = {}) => {
      const hourTypeId = state.selectedHourTypeId || defaultHourTypeId();
      const manualPreferred = opts.manualPreferred != null
        ? opts.manualPreferred
        : (dom.manualContract ? dom.manualContract.value : (state.currentEntry?.contract_id || ''));
      const punchPreferred = opts.punchPreferred != null
        ? opts.punchPreferred
        : (dom.punchContract ? dom.punchContract.value : (state.currentEntry?.contract_id || ''));
      renderContractsForSelect(dom.manualContract, dom.manualContractWarning, hourTypeId, manualPreferred, 'simple');
      renderContractsForSelect(dom.punchContract, dom.punchContractWarning, hourTypeId, punchPreferred, 'detailed');
    };

    // Which entry surfaces the current day offers (desktop's dayEntryModes, mirrored): the union over the
    // configured source, PLUS the kind of any entry already logged (so an
    // existing entry never becomes unreachable if a contract's mode later changes), falling back to the
    // global default when the day has no signal at all.
    const dayEntryModes = () => {
      let simple = false, detailed = false;
      if (entryModeSource() === 'hour_type') {
        const types = hourTypesEnabled() ? state.hourTypes : [state.hourTypeMap[defaultHourTypeId()]];
        types.filter(Boolean).forEach((ht) => {
          if (hourTypeEffectiveEntryMode(ht) === 'detailed') detailed = true; else simple = true;
        });
      } else {
        validContractsForDate(state.currentDate).forEach((c) => {
          if (contractEffectiveEntryMode(c) === 'detailed') detailed = true; else simple = true;
        });
      }
      (state.entries || []).forEach((e) => {
        if (!e || e.date !== state.currentDate) return;
        if ((e.entry_type || 'basic') === 'advanced') detailed = true; else simple = true;
      });
      if (!simple && !detailed) {
        if (globalDefaultEntryMode() === 'detailed') detailed = true; else simple = true;
      }
      return { simple, detailed, both: simple && detailed };
    };

    // Collapse the Basic/Punch chrome to what the day actually offers: one mode → hide the segmented
    // control and force the matching panel (a Sessions-only user never sees Total hours); both → keep the
    // toggle and the user's chosen mode. Replaces the old whole-day entry-method lock — the real
    // invariant (one Basic OR Punch entry per hour type + contract) is enforced at save, like desktop.
    const applyDayModeChrome = () => {
      const modes = dayEntryModes();
      if (dom.seg) dom.seg.style.display = modes.both ? 'flex' : 'none';
      let target = modes.both ? state.mode : (modes.detailed ? 'punch' : 'manual');
      if (modes.both && entryModeSource() === 'hour_type' && !(state.entries || []).length) {
        const selected = state.hourTypeMap[state.selectedHourTypeId || defaultHourTypeId()];
        target = hourTypeEffectiveEntryMode(selected) === 'detailed' ? 'punch' : 'manual';
      }
      setMode(target);
    };

    const updateManualActions = () => {
      // The manual panel has no action buttons anymore — the keypad commits and swipe deletes. Just keep
      // the Quick log trigger in sync.
      renderQuickEntryButton();
    };

    // "HH:MM" (24h) → "h:mm am/pm" for display. Times are stored 24h; the UI shows 12h.
    const to12h = (hhmm) => {
      const m = timeToMinutes(hhmm);
      if (m === null) return hhmm || '--';
      let h = Math.floor(m / 60);
      const min = m % 60;
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12; if (h === 0) h = 12;
      return h + ':' + String(min).padStart(2, '0') + ' ' + ampm;
    };
    // Wall-clock time of the last Punch In this session — used to ignore an accidental double-tap clock-out.
    let lastPunchInMs = 0;

    // The day's advanced (punch) entry for the currently-selected hour type + contract, if any.
    const findDayPunchEntry = () => {
      const ht = state.selectedHourTypeId || defaultHourTypeId();
      const contractId = dom.punchContract ? dom.punchContract.value : '';
      return (state.entries || []).find((e) => e && e.date === state.currentDate
        && (e.entry_type || 'basic') === 'advanced'
        && (e.hour_type_id || defaultHourTypeId()) === ht
        && (e.contract_id || '') === (contractId || '')) || null;
    };
    const openSessionOf = (entry) => (entry && (entry.punches || []).find((p) => p && p.in && !p.out)) || null;

    let clockTimer = null;
    const fmtElapsed = (ms) => {
      const s = Math.max(0, Math.floor(ms / 1000));
      return Math.floor(s / 3600) + 'h ' + String(Math.floor((s % 3600) / 60)).padStart(2, '0') + 'm ' + String(s % 60).padStart(2, '0') + 's';
    };
    const tickClock = () => {
      const open = openSessionOf(findDayPunchEntry());
      if (!open || !dom.punchTimer) { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } return; }
      const inMin = timeToMinutes(open.in);
      if (inMin === null) return;
      const now = new Date();
      const start = new Date(now); start.setHours(Math.floor(inMin / 60), inMin % 60, 0, 0);
      dom.punchTimer.textContent = fmtElapsed(now.getTime() - start.getTime());
    };
    // Reflect the saved day's punch state into the clock: on the clock (open session) vs idle, the live
    // timer, and the hero button label/enabled state. The saved entries are the source of truth now.
    const updatePunchClock = () => {
      if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
      const entry = findDayPunchEntry();
      const open = openSessionOf(entry);
      const ht = state.hourTypeMap[state.selectedHourTypeId || defaultHourTypeId()] || {};
      const hasContract = dom.punchContract ? !!dom.punchContract.value : true;
      if (dom.punchToggle) {
        dom.punchToggle.textContent = open ? 'Punch Out' : 'Punch In';
        dom.punchToggle.classList.toggle('is-out', !!open);
        dom.punchToggle.disabled = state.loading || (hourTypeNeedsContract(ht) && !hasContract);
      }
      if (dom.punchClockstat) dom.punchClockstat.style.display = open ? 'flex' : 'none';
      if (open && dom.punchSince) dom.punchSince.textContent = to12h(open.in);
      // Only run the live timer for today; a past day's "open" punch shows just its start time.
      if (open && state.currentDate === todayIso()) { tickClock(); clockTimer = setInterval(tickClock, 1000); }
    };

    // ----- App-bar live clock: shows next to the brand on EVERY view (Basic or Punch) while a punch is open
    // today, so the running clock is always visible (not just on the Punch view's hero panel). -----
    const fmtClock = (ms) => {
      let s = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(s / 3600); s -= h * 3600;
      const m = Math.floor(s / 60); s -= m * 60;
      const p = (n) => String(n).padStart(2, '0');
      return (h > 0 ? h + ':' + p(m) : String(m)) + ':' + p(s);
    };
    // The earliest open-session start (minutes-of-day) among the CURRENT day's entries — any hour type, so a
    // forgotten open punch of a different type than the one selected still surfaces a clock. null if none.
    const currentDayOpenStartMin = () => {
      let earliest = null;
      (state.entries || []).forEach((e) => {
        if (!e || e.date !== state.currentDate || !Array.isArray(e.punches)) return;
        e.punches.forEach((p) => {
          if (p && p.in && !p.out) {
            const m = timeToMinutes(p.in);
            if (m !== null && (earliest === null || m < earliest)) earliest = m;
          }
        });
      });
      return earliest;
    };
    let headerClockTimer = null;
    const tickHeaderClock = () => {
      if (!dom.appbarClock || !dom.appbarClockTime) return;
      const startMin = currentDayOpenStartMin();
      // Only a live clock for an open punch on TODAY (a past/future open punch can't show sensible elapsed).
      if (startMin === null || state.currentDate !== todayIso()) {
        dom.appbarClock.style.display = 'none';
        if (headerClockTimer) { clearInterval(headerClockTimer); headerClockTimer = null; }
        return;
      }
      dom.appbarClock.style.display = 'inline-flex';
      const now = new Date();
      const start = new Date(now); start.setHours(Math.floor(startMin / 60), startMin % 60, 0, 0);
      dom.appbarClockTime.textContent = fmtClock(now.getTime() - start.getTime());
    };
    const updateHeaderClock = () => {
      if (headerClockTimer) { clearInterval(headerClockTimer); headerClockTimer = null; }
      tickHeaderClock();
      if (dom.appbarClock && dom.appbarClock.style.display !== 'none') {
        headerClockTimer = setInterval(tickHeaderClock, 1000);
      }
    };

    // Switching is always free — the old "can't switch, this day already has a X entry" guard is gone.
    // A same-(hour type, contract) conflict surfaces at save via the duplicate guard instead, matching
    // desktop's Basic/Sessions tabs.
    const setMode = (mode) => {
      state.mode = mode === 'punch' ? 'punch' : 'manual';
      if (dom.tabManual) dom.tabManual.classList.toggle('active', state.mode === 'manual');
      if (dom.tabPunch) dom.tabPunch.classList.toggle('active', state.mode === 'punch');
      if (dom.panelManual) dom.panelManual.style.display = state.mode === 'manual' ? 'block' : 'none';
      if (dom.panelPunch) dom.panelPunch.style.display = state.mode === 'punch' ? 'block' : 'none';
      updateManualActions();
      updatePunchClock();
    };

    const sortHourTypeIds = (ids) => {
      const order = state.hourTypes.reduce((map, ht, idx) => {
        if (ht && ht.id) map[ht.id] = idx;
        return map;
      }, {});
      return ids.slice().sort((a, b) => {
        const orderA = Number.isInteger(order[a]) ? order[a] : Number.MAX_SAFE_INTEGER;
        const orderB = Number.isInteger(order[b]) ? order[b] : Number.MAX_SAFE_INTEGER;
        if (orderA !== orderB) return orderA - orderB;
        const nameA = state.hourTypeMap[a]?.name || '';
        const nameB = state.hourTypeMap[b]?.name || '';
        return nameA.localeCompare(nameB);
      });
    };

    // The old "logged today" hero card was removed; renderDayCard is now just the day's render orchestrator.
    const renderDayCard = () => {
      renderEntriesList();
      // Re-derive the day's Basic/Punch chrome from its current contracts + entries (adding or deleting
      // an entry can change which surfaces the day offers).
      applyDayModeChrome();
      syncHoursDisplay();
      updatePunchClock();
      updateHeaderClock();
    };

    // Delete an entry given the entry object (used by swipe-to-delete, independent of the form's
    // currentEntry). Optimistic: removes locally and re-renders at once, then syncs the server in the
    // background and restores on failure. Backend delete is idempotent, so a phantom row clears too.
    const swipeDelete = async (entry) => {
      if (!entry) return;
      const id = entry.id;
      const isCurrent = state.currentEntry && state.currentEntry.id === id;
      if (isCurrent) {
        state.currentEntry = null;
        state.draftHours = '';
        state.draftPunches = [{ in: '', out: '' }];
        state.punchDirty = false;
        hydrateDraftFromEntry(null, { preserveMode: true });
      }
      const backup = getCachedEntriesForDate(state.currentDate).slice();
      removeEntryLocally(id);
      renderDayCard();
      scrollToTop(); // user scrolled down to the entries list to delete — bring them back to the top
      if (typeof id === 'string' && id.indexOf('temp_') === 0) {
        setStatus('Removed.', 'success');
        return;
      }
      // Already removed optimistically above — no "Deleting…" flash; just confirm or roll back.
      const res = await run('api_deleteEntry', id);
      if (res === null) {
        // Genuine server error — restore the entry and re-render.
        state.entryCache[state.currentDate] = backup;
        state.entries = backup;
        persistCache();
        renderDayCard();
        setStatus('Delete failed. Please try again.', 'error');
      } else {
        setStatus('Deleted.', 'success');
      }
    };

    // Animate a row out (slide off in the swipe direction + collapse its height) before removing it,
    // so a full-swipe or tapped delete feels like iOS rather than the row just vanishing in place.
    const commitSwipeDelete = (wrapper, fg, entry) => {
      if (wrapper.dataset.removing === '1') return;
      wrapper.dataset.removing = '1';
      fg.classList.add('snap');
      fg.style.transform = 'translateX(-100%)';
      const h = wrapper.offsetHeight;
      wrapper.style.height = h + 'px';
      void wrapper.offsetHeight; // force reflow so the height transition has a start value
      wrapper.classList.add('removing');
      wrapper.style.height = '0px';
      window.setTimeout(() => swipeDelete(entry), 230);
    };

    // iOS-style swipe: drag the foreground row left over a red delete action. A short swipe snaps open
    // to reveal the button; dragging past ~45% of the row width deletes immediately on release.
    const SWIPE_REVEAL = 88;
    const attachSwipe = (wrapper, fg, entry) => {
      let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false;
      const width = () => wrapper.offsetWidth || 320;
      const setX = (x) => { fg.style.transform = 'translateX(' + x + 'px)'; };
      const closeOthers = () => {
        if (!dom.entriesList) return;
        dom.entriesList.querySelectorAll('.ts-m-swipe.open').forEach((w) => {
          if (w === wrapper) return;
          const other = w.querySelector('.ts-m-entry');
          if (other) { other.classList.add('snap'); other.style.transform = 'translateX(0)'; }
          w.classList.remove('open');
        });
      };
      const onStart = (e) => {
        const t = e.touches ? e.touches[0] : e;
        startX = t.clientX; startY = t.clientY; dx = 0;
        dragging = true; decided = false; horizontal = false;
        fg.classList.remove('snap');
      };
      const onMove = (e) => {
        if (!dragging) return;
        const t = e.touches ? e.touches[0] : e;
        const mx = t.clientX - startX;
        const my = t.clientY - startY;
        if (!decided) {
          if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
          decided = true;
          horizontal = Math.abs(mx) > Math.abs(my);
          if (horizontal) closeOthers();
        }
        if (!horizontal) { dragging = false; return; }
        e.preventDefault();
        wrapper.classList.add('armed');
        const base = wrapper.classList.contains('open') ? -SWIPE_REVEAL : 0;
        dx = Math.min(0, base + mx);
        setX(dx);
        wrapper.classList.toggle('will-delete', dx <= -width() * 0.45);
      };
      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        fg.classList.add('snap');
        if (dx <= -width() * 0.45) {
          wrapper.classList.remove('will-delete');
          commitSwipeDelete(wrapper, fg, entry);
        } else if (dx <= -SWIPE_REVEAL * 0.5) {
          setX(-SWIPE_REVEAL);
          wrapper.classList.add('open');
        } else {
          setX(0);
          wrapper.classList.remove('open');
          wrapper.classList.remove('armed');
        }
      };
      fg.addEventListener('touchstart', onStart, { passive: true });
      fg.addEventListener('touchmove', onMove, { passive: false });
      fg.addEventListener('touchend', onEnd);
      fg.addEventListener('touchcancel', onEnd);
      // A tap closes an open row; a tap on a closed row edits it; a tap that ended a swipe is ignored.
      fg.addEventListener('click', (ev) => {
        if (wrapper.classList.contains('open')) {
          ev.preventDefault(); ev.stopPropagation();
          fg.classList.add('snap'); setX(0); wrapper.classList.remove('open'); wrapper.classList.remove('armed');
          return;
        }
        if (decided) { ev.preventDefault(); ev.stopPropagation(); return; }
        // Punch entries open the session editor; basic entries open the hours keypad.
        if ((entry.entry_type || 'basic') === 'advanced') openPunchEditor(entry);
        else openKeypad(entry);
      });
    };

    const renderEntriesList = () => {
      if (!dom.entriesList) return;
      const entries = (state.entries || []).filter((e) => e && e.date === state.currentDate);
      dom.entriesList.innerHTML = '';
      if (!entries.length) {
        if (dom.entriesCard) dom.entriesCard.style.display = 'none';
        if (dom.emptyState) dom.emptyState.style.display = '';
        return;
      }
      if (dom.entriesCard) dom.entriesCard.style.display = '';
      if (dom.emptyState) dom.emptyState.style.display = 'none';
      if (dom.dayTotalVal) {
        const totalMins = entries.reduce((acc, e) => acc + roundDuration(Number(e.duration_minutes) || 0, roundInterval()), 0);
        dom.dayTotalVal.textContent = trimHours(formatHours(totalMins)) + 'h';
      }
      const sortedIds = sortHourTypeIds(entries.map((e) => e.hour_type_id || defaultHourTypeId()));
      entries
        .slice()
        .sort((a, b) => sortedIds.indexOf(a.hour_type_id || defaultHourTypeId()) - sortedIds.indexOf(b.hour_type_id || defaultHourTypeId()))
        .forEach((entry) => {
          const hourType = state.hourTypeMap[entry.hour_type_id || defaultHourTypeId()] || {};
          const minutes = roundDuration(Number(entry.duration_minutes) || 0, roundInterval());
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'ts-m-entry';
          const ic = document.createElement('span');
          ic.className = 'ts-m-entry-ic';
          ic.innerHTML = hourTypeIconSvg(hourType.icon);
          const info = document.createElement('span');
          info.className = 'ts-m-entry-info';
          const title = document.createElement('span');
          title.className = 'ts-m-entry-t';
          title.textContent = hourType.name || 'Work';
          info.appendChild(title);
          const contract = state.contracts.find((c) => c.id === entry.contract_id);
          if (contract && contract.name) {
            const cEl = document.createElement('span');
            cEl.className = 'ts-m-entry-contract';
            cEl.textContent = contract.name;
            info.appendChild(cEl);
          }
          // Punch entries show their session span (or a "running" badge while a session is open).
          const isPunch = (entry.entry_type || 'basic') === 'advanced';
          const punchSummary = isPunch ? summarizePunches(entry.punches || []) : null;
          const isOpenNoHours = isPunch && punchSummary && punchSummary.openCount > 0 && minutes === 0;
          if (isPunch && punchSummary) {
            const sub = document.createElement('span');
            sub.className = 'ts-m-entry-sub';
            // First session span only; "…" if more. Open sessions end in "open". No separate "Open" badge that
            // pushed the row up — the "Open" marker now lives in the hours slot on the right (matches desktop agenda).
            const sessions = (entry.punches || []).filter((p) => p && p.in);
            const first = sessions[0];
            sub.textContent = first
              ? to12h(first.in) + ' – ' + (first.out ? to12h(first.out) : 'open') + (sessions.length > 1 ? ' …' : '')
              : '';
            if (sub.textContent) info.appendChild(sub);
          }
          const hrs = document.createElement('span');
          hrs.className = 'ts-m-entry-hrs' + (isOpenNoHours ? ' ts-m-entry-hrs--open' : '');
          // Open punch with nothing logged yet → "Open" on the right (not a bare "–"); else the hours.
          hrs.textContent = isOpenNoHours ? 'Open' : trimHours(formatHours(minutes)) + 'h';
          row.appendChild(ic);
          row.appendChild(info);
          row.appendChild(hrs);
          const wrapper = document.createElement('div');
          wrapper.className = 'ts-m-swipe';
          const action = document.createElement('button');
          action.type = 'button';
          action.className = 'ts-m-swipe-action';
          action.textContent = 'Delete';
          action.addEventListener('click', (ev) => { ev.stopPropagation(); commitSwipeDelete(wrapper, row, entry); });
          wrapper.appendChild(action);
          wrapper.appendChild(row);
          attachSwipe(wrapper, row, entry);
          dom.entriesList.appendChild(wrapper);
        });
    };

    const openDatePicker = () => {
      const current = new Date(state.currentDate);
      if (Number.isNaN(current.getTime())) return;
      state.datePicker.year = current.getFullYear();
      state.datePicker.month = current.getMonth();
      renderDatePicker();
      if (dom.datePicker) dom.datePicker.style.display = 'flex';
    };

    const closeDatePicker = () => {
      if (dom.datePicker) dom.datePicker.style.display = 'none';
    };

    const renderDatePicker = () => {
      if (!dom.dateGrid || !dom.dateMonthLabel) return;
      const year = state.datePicker.year;
      const month = state.datePicker.month;
      if (year == null || month == null) return;
      const labelDate = new Date(year, month, 1);
      dom.dateMonthLabel.textContent = labelDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      dom.dateGrid.innerHTML = '';
      if (dom.dateWeekdays) {
        dom.dateWeekdays.innerHTML = '';
        weekdayLabels.forEach((label) => {
          const el = document.createElement('div');
          el.className = 'ts-day-picker-weekday';
          el.textContent = label;
          dom.dateWeekdays.appendChild(el);
        });
      }
      const totalDays = daysInMonth(year, month);
      const firstDay = new Date(year, month, 1);
      const offset = (firstDay.getDay() + 6) % 7; // Monday start
      for (let i = 0; i < offset; i += 1) {
        const empty = document.createElement('div');
        empty.className = 'ts-day-picker-cell empty';
        dom.dateGrid.appendChild(empty);
      }
      for (let day = 1; day <= totalDays; day += 1) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ts-day-picker-cell';
        btn.textContent = String(day);
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        if (iso === state.currentDate) btn.classList.add('active');
        btn.onclick = () => {
          closeDatePicker();
          hydrateDate(iso);
        };
        dom.dateGrid.appendChild(btn);
      }
    };

    const addDaysIso = (iso, n) => {
      const d = new Date(iso + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return iso;
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    };

    // Legacy hook: the punch panel no longer renders an inline draft list. Callers that used to refresh it
    // now just re-sync the clock from the saved entries.
    const renderPunchList = () => updatePunchClock();

    // Build + save an advanced (punch) entry. `existing` is the entry being updated (null = new); the
    // optional `dateOverride` lets the overnight split spill the remainder onto the next day.
    const savePunchEntry = (existing, punches, hourTypeId, contractId, dateOverride) => {
      const cleaned = normalizePunchList(punches);
      const summary = summarizePunches(cleaned);
      const rounded = roundDuration(summary.totalMinutes, roundInterval());
      return saveEntry({
        id: existing ? existing.id : undefined,
        date: dateOverride || state.currentDate,
        punches: cleaned,
        duration_minutes: rounded,
        contract_id: contractId,
        hour_type_id: hourTypeId,
        round_interval: roundInterval(),
        entry_type: 'advanced'
      });
    };

    // One-tap clock. Punch In saves an open session immediately; Punch Out closes it and saves. Mirrors
    // desktop: overnight punches split across two days, and an accidental too-fast clock-out is abandoned
    // (you stay on the clock) instead of logging a zero-length session.
    const togglePunch = async () => {
      if (state.loading) return;
      const hourTypeId = state.selectedHourTypeId || defaultHourTypeId();
      const hourType = state.hourTypeMap[hourTypeId] || {};
      const contractId = dom.punchContract ? dom.punchContract.value : '';
      if (hourTypeNeedsContract(hourType)) {
        if (!contractId) { setStatus('Select a contract for this hour type.', 'error'); return; }
        const contract = state.contracts.find((c) => c.id === contractId);
        if (!contract || !contractIsValid(contract, state.currentDate)) {
          setStatus('Selected contract is not valid for this date.', 'error');
          return;
        }
      }
      const nowTime = new Date().toTimeString().slice(0, 5);
      const existing = findDayPunchEntry();
      const punches = existing ? (existing.punches || []).map((p) => ({ ...p })) : [];
      const openIdx = punches.findIndex((p) => p && p.in && !p.out);
      if (openIdx !== -1) {
        const inMin = timeToMinutes(punches[openIdx].in);
        const outMin = timeToMinutes(nowTime);
        if (inMin !== null && outMin !== null && outMin < inMin) {
          punches[openIdx].out = '23:59';
          await savePunchEntry(existing, punches, hourTypeId, contractId);
          await savePunchEntry(null, [{ in: '00:00', out: nowTime }], hourTypeId, contractId, addDaysIso(state.currentDate, 1));
          setStatus('Overnight punch split across two days', 'success');
          return;
        }
        // Ignore only a genuine accidental double-tap (clock-out within a few seconds of clocking in);
        // a deliberate clock-out always closes the session.
        if (lastPunchInMs && Date.now() - lastPunchInMs < 3000) {
          setStatus('Still on the clock.', 'info');
          return;
        }
        punches[openIdx].out = nowTime;
        lastPunchInMs = 0;
        await savePunchEntry(existing, punches, hourTypeId, contractId);
        setStatus('Punched out at ' + to12h(nowTime), 'success');
      } else {
        punches.push({ in: nowTime, out: '' });
        lastPunchInMs = Date.now();
        await savePunchEntry(existing, punches, hourTypeId, contractId);
        setStatus('Punched in at ' + to12h(nowTime), 'success');
      }
    };

    // ----- Session editor sheet: view/edit/delete a punch entry's sessions (reached by tapping the entry) -----
    let punchEditorEntry = null;
    let punchEditorSessions = [];
    let punchEditorEdited = false; // becomes true once the user touches a time field → button reverts to "Done"
    const editorHasOpenSession = () => punchEditorSessions.some((s) => s && s.in && !s.out);
    // While a session is open AND untouched, the primary button is "Punch out" (clock it out now). Once the
    // user edits any time (or fills the out field), it becomes "Done" — they're manually setting the times.
    const updatePunchEditorButton = () => {
      if (!dom.punchEditorDone) return;
      const punchOut = editorHasOpenSession() && !punchEditorEdited;
      dom.punchEditorDone.textContent = punchOut ? 'Punch out' : 'Done';
      dom.punchEditorDone.dataset.mode = punchOut ? 'punchout' : 'done';
    };
    const renderPunchEditorSessions = () => {
      if (!dom.punchEditorList) return;
      dom.punchEditorList.innerHTML = '';
      punchEditorSessions.forEach((sess, index) => {
        const row = document.createElement('div');
        row.className = 'ts-m-sess';
        const start = document.createElement('input');
        start.type = 'time'; start.value = sess.in || ''; start.className = 'ts-m-sess-time';
        start.onchange = () => { punchEditorSessions[index].in = start.value; punchEditorEdited = true; updatePunchEditorButton(); };
        const arrow = document.createElement('span');
        arrow.className = 'ts-m-sess-arrow'; arrow.setAttribute('aria-hidden', 'true'); arrow.textContent = '→';
        const end = document.createElement('input');
        end.type = 'time'; end.value = sess.out || ''; end.className = 'ts-m-sess-time';
        end.onchange = () => { punchEditorSessions[index].out = end.value; punchEditorEdited = true; updatePunchEditorButton(); };
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'ts-m-sess-x'; del.setAttribute('aria-label', 'Remove session'); del.textContent = '×';
        del.onclick = () => {
          punchEditorSessions.splice(index, 1);
          if (!punchEditorSessions.length) punchEditorSessions = [{ in: '', out: '' }];
          renderPunchEditorSessions();
          updatePunchEditorButton();
        };
        row.append(start, arrow, end, del);
        dom.punchEditorList.appendChild(row);
      });
    };
    const openPunchEditor = (entry) => {
      if (!entry) return;
      punchEditorEntry = entry;
      punchEditorEdited = false;
      // Only real sessions — never stray blank rows.
      punchEditorSessions = (entry.punches || []).filter((p) => p && (p.in || p.out)).map((p) => ({ ...p }));
      if (!punchEditorSessions.length) punchEditorSessions = [{ in: '', out: '' }];
      const ht = state.hourTypeMap[entry.hour_type_id || defaultHourTypeId()] || {};
      const contract = state.contracts.find((c) => c.id === entry.contract_id);
      if (dom.punchEditorSub) dom.punchEditorSub.textContent = (ht.name || 'Work') + (contract && contract.name ? ' · ' + contract.name : '');
      renderPunchEditorSessions();
      updatePunchEditorButton();
      if (dom.punchEditor) dom.punchEditor.style.display = 'flex';
    };
    // "Punch out" from the editor: close the open session at now and save (reuses the save path). Falls back
    // to a plain save if nothing's open. Overnight (out < in) is rejected by validatePunches — rare from here.
    const punchOutFromEditor = async () => {
      const entry = punchEditorEntry;
      if (!entry) { closePunchEditor(); return; }
      const sessions = punchEditorSessions.map((s) => ({ ...s }));
      const openIdx = sessions.findIndex((s) => s && s.in && !s.out);
      if (openIdx === -1) { savePunchEditor(); return; }
      const nowTime = new Date().toTimeString().slice(0, 5);
      sessions[openIdx].out = nowTime;
      const cleaned = normalizePunchList(sessions);
      const err = validatePunches(cleaned);
      if (err) { setStatus(err, 'error'); return; }
      closePunchEditor();
      await savePunchEntry(entry, cleaned, entry.hour_type_id || defaultHourTypeId(), entry.contract_id || '');
      setStatus('Punched out at ' + to12h(nowTime), 'success');
    };
    const closePunchEditor = () => {
      punchEditorEntry = null;
      if (dom.punchEditor) dom.punchEditor.style.display = 'none';
    };
    const savePunchEditor = async () => {
      const entry = punchEditorEntry;
      if (!entry) { closePunchEditor(); return; }
      const cleaned = normalizePunchList(punchEditorSessions);
      // All sessions removed via × → nothing left to keep, so Done deletes the whole entry (a user who didn't
      // know about swipe-to-delete shouldn't get stuck). swipeDelete handles both unsaved and server entries.
      if (!cleaned.length) { closePunchEditor(); await swipeDelete(entry); return; }
      const err = validatePunches(cleaned);
      if (err) { setStatus(err, 'error'); return; }
      closePunchEditor();
      await savePunchEntry(entry, cleaned, entry.hour_type_id || defaultHourTypeId(), entry.contract_id || '');
    };

    const validatePunches = (punches) => {
      const sorted = normalizePunchList(punches);
      let lastEnd = null;
      for (let i = 0; i < sorted.length; i += 1) {
        const punch = sorted[i];
        const startMinutes = timeToMinutes(punch.in);
        if (startMinutes === null) return 'Each punch needs a start time.';
        const endMinutes = timeToMinutes(punch.out);
        if (endMinutes !== null && endMinutes <= startMinutes) return 'Punch end must be after start.';
        if (lastEnd !== null && startMinutes < lastEnd) return 'Punches cannot overlap.';
        if (endMinutes !== null) lastEnd = endMinutes;
      }
      return '';
    };


    const getCachedEntriesForDate = (dateIso) => state.entryCache[dateIso] || [];

    const removeEntryLocally = (id) => {
      const filtered = getCachedEntriesForDate(state.currentDate).filter((e) => e.id !== id);
      state.entryCache[state.currentDate] = filtered;
      state.entries = filtered;
      persistCache();
    };

    const storeEntries = (entries) => {
      (entries || []).forEach((entry) => {
        if (!entry || !entry.date) return;
        const existing = getCachedEntriesForDate(entry.date).filter((e) => e.id !== entry.id);
        existing.push(entry);
        state.entryCache[entry.date] = existing;
      });
      persistCache();
    };

    const persistCache = () => {
      try {
        const payload = {
          savedAt: Date.now(),
          entries: state.entryCache,
          prefetchedRange: state.prefetchedRange,
          hourTypes: state.hourTypes,
          contracts: state.contracts
        };
        localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
      } catch (err) {
        state.cacheHydrated = false;
        setStatus('Offline cache is unavailable; saved server data is unaffected.', 'error');
      }
    };

    const derivePrefetchedRangeFromCache = () => {
      const dates = Object.keys(state.entryCache || {}).filter(Boolean).sort();
      if (!dates.length) return null;
      return { start: dates[0], end: dates[dates.length - 1] };
    };

    const hydrateCacheFromStorage = () => {
      if (state.cacheHydrated) return;
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.savedAt) return;
        const age = Date.now() - parsed.savedAt;
        if (age > CACHE_TTL_MS) {
          localStorage.removeItem(CACHE_KEY);
          return;
        }
        state.entryCache = parsed.entries || {};
        // Purge stale optimistic placeholders left in the cache by the earlier
        // double-add bug so days don't show doubled hours after upgrading.
        Object.keys(state.entryCache).forEach((d) => {
          state.entryCache[d] = (state.entryCache[d] || []).filter(
            // Also drop break/comment records — desktop day-shape/day-note rows, not entries here.
            (e) => !(e && typeof e.id === 'string' && e.id.indexOf('temp_') === 0)
              && !(e && (e.entry_type === 'break' || e.entry_type === 'comment'))
          );
        });
        state.prefetchedRange = parsed.prefetchedRange || derivePrefetchedRangeFromCache();
        state.hourTypes = Array.isArray(parsed.hourTypes) ? parsed.hourTypes : state.hourTypes;
        state.hourTypeMap = (state.hourTypes || []).reduce((map, ht) => { map[ht.id] = ht; return map; }, {});
        state.contracts = Array.isArray(parsed.contracts) ? parsed.contracts : state.contracts;
        state.cacheHydrated = true;
      } catch (err) {
        console.log('[mobile] cache hydrate failed', err);
      }
    };

    const hydrateFromDesktopCache = () => {
      if (state.cacheHydrated) return;
      try {
        const raw = localStorage.getItem('tempus_cache_v3_core') || localStorage.getItem('ts_cache');
        if (!raw) return;
        const stored = JSON.parse(raw);
        const parsed = stored && stored.version === 3 && stored.data ? stored.data : stored;
        if (!parsed || !Array.isArray(parsed.entries)) return;
        const map = {};
        let minDate = null;
        let maxDate = null;
        parsed.entries.map((e) => sanitizeEntry(e)).forEach((entry) => {
          if (!entry || !entry.date) return;
          if (entry.entry_type === 'break' || entry.entry_type === 'comment') return; // desktop day-shape/day-note records aren't mobile entries
          if (!map[entry.date]) map[entry.date] = [];
          map[entry.date].push(entry);
          if (!minDate || entry.date < minDate) minDate = entry.date;
          if (!maxDate || entry.date > maxDate) maxDate = entry.date;
        });
        state.entryCache = map;
        state.hourTypes = Array.isArray(parsed.hourTypes) ? parsed.hourTypes.map((ht) => ({ ...ht })) : state.hourTypes;
        state.hourTypeMap = (state.hourTypes || []).reduce((m, ht) => { m[ht.id] = ht; return m; }, {});
        state.contracts = Array.isArray(parsed.contracts) ? parsed.contracts.map((c) => ({ ...c })) : state.contracts;
        state.prefetchedRange = minDate && maxDate ? { start: minDate, end: maxDate } : derivePrefetchedRangeFromCache();
        state.cacheHydrated = true;
        persistCache();
      } catch (err) {
        console.log('[mobile] desktop cache hydrate failed', err);
      }
      if (!state.cacheHydrated) state.cacheHydrated = true;
    };

    const fetchEntriesRange = async (startDate, endDate) => {
      const entries = await run('api_getEntries', { startDate, endDate }) || [];
      // Break and comment records are desktop Sessions concepts (day shape / day note) — never day
      // entries here. Without the comment filter a day note rendered as a phantom 0h swipeable row.
      const sanitized = entries.map(sanitizeEntry).filter((e) => !(e && (e.entry_type === 'break' || e.entry_type === 'comment')));
      storeEntries(sanitized);
    };

    const rangeCovered = (range, startIso, endIso) => {
      return range && range.start && range.end && range.start <= startIso && range.end >= endIso;
    };

    const cacheCoverageRange = () => derivePrefetchedRangeFromCache() || state.prefetchedRange || null;

    const prefetchRangeForDate = async (centerIso) => {
      const startIso = shiftIso(centerIso, -14);
      const endIso = shiftIso(centerIso, 14);
      const cachedRange = cacheCoverageRange();
      if (rangeCovered(cachedRange, startIso, endIso)) {
        state.prefetchedRange = cachedRange;
        return;
      }
      await fetchEntriesRange(startIso, endIso);
      const currentRange = cacheCoverageRange() || { start: startIso, end: endIso };
      const mergedStart = currentRange.start && currentRange.start < startIso ? currentRange.start : startIso;
      const mergedEnd = currentRange.end && currentRange.end > endIso ? currentRange.end : endIso;
      state.prefetchedRange = { start: mergedStart, end: mergedEnd };
      persistCache();
    };

    const loadEntriesForDate = async (dateIso) => {
      // Paint the selected day as fast as possible: use cache if we have it, else fetch JUST that day
      // (a 1-day call returns quickly) before prefetching the surrounding range in the background. The old
      // order fetched a 28-day range first, so today's punch took the whole range round-trip to appear.
      const cached = getCachedEntriesForDate(dateIso);
      if (cached.length) {
        state.entries = cached;
      } else {
        await fetchEntriesRange(dateIso, dateIso);
        state.entries = getCachedEntriesForDate(dateIso);
      }
      prefetchRangeForDate(dateIso); // background — don't block the first paint on the wider range
    };

    const selectHourType = (hourTypeId) => {
      state.selectedHourTypeId = hourTypeId || defaultHourTypeId();
      syncHourTypeSelects(state.selectedHourTypeId);
      if (entryModeSource() === 'hour_type') {
        const selected = state.hourTypeMap[state.selectedHourTypeId];
        state.mode = hourTypeEffectiveEntryMode(selected) === 'detailed' ? 'punch' : 'manual';
      }
      // Add-mode form: changing the hour type just re-targets the new entry (and auto-selects a valid
      // contract). It never loads an existing entry for editing — that's done by tapping the entry's row.
      renderContracts();
      renderDayCard();
    };

    const hydrateDraftFromEntry = (entry, opts = {}) => {
      state.currentEntry = entry || null;
      const hourTypeId = entry?.hour_type_id || state.selectedHourTypeId || defaultHourTypeId();
      state.selectedHourTypeId = hourTypeId;
      syncHourTypeSelects(hourTypeId);
      const preferredContract = entry?.contract_id || '';
      renderContracts({ manualPreferred: preferredContract, punchPreferred: preferredContract });
      if (entry) {
        if (entry.entry_type === 'advanced') {
          state.mode = 'punch';
          state.draftPunches = entry.punches && entry.punches.length ? entry.punches.map((p) => ({ ...p })) : [{ in: '', out: '' }];
          state.draftHours = '';
          state.punchDirty = false;
        } else {
          state.mode = 'manual';
          const summary = summarizePunches(entry.punches || []);
          const minutes = summary.totalMinutes || Number(entry.duration_minutes) || 0;
          state.draftHours = minutes ? (minutes / 60).toFixed(2) : '';
          state.draftPunches = [{ in: '', out: '' }];
          state.punchDirty = false;
        }
      } else {
        state.draftHours = '';
        state.draftPunches = [{ in: '', out: '' }];
        state.punchDirty = false;
        if (!opts.preserveMode) state.mode = 'manual';
      }
      if (dom.hours) dom.hours.value = state.draftHours;
      syncHoursDisplay();
      renderPunchList();
      // Apply through the day-mode chrome: it honours state.mode when the day offers both surfaces and
      // forces the sole available one otherwise (a loaded entry's kind counts as a surface, so editing
      // an off-mode entry still lands on its panel).
      applyDayModeChrome();
    };

    const loadStaticData = async () => {
      if (state.staticLoaded) return true;
      let base = { settings: {}, featureFlags: {} };
      if (mobileShell.loadBaseState) {
        base = await mobileShell.loadBaseState();
      }
      state.settings = base.settings || {};
      state.featureFlags = base.featureFlags || {};
      if (!state.hourTypes.length || !state.contracts.length) {
        // Cold boot (nothing cached): block the first paint on the fetch — there's nothing to show anyway.
        await refreshStaticFromServer({ force: true });
      } else {
        state.hourTypeMap = state.hourTypes.reduce((map, ht) => { map[ht.id] = ht; return map; }, {});
        // Warm boot: the cache painted instantly above; revalidate behind it so contracts and hour types
        // edited on desktop actually arrive (the cache used to be trusted for its whole 24h TTL — a new
        // contract created on desktop was invisible on the phone until the cache expired).
        refreshStaticFromServer();
      }
      renderHourTypes();
      renderContracts();
      state.staticLoaded = true;
      return true;
    };

    // Re-pull hour types + contracts and repaint everything they drive (pickers, quick actions, the
    // day-mode chrome). The localStorage cache is only the first paint now, never the truth. `null` from
    // a call is a transient GAS hiccup — keep what we have rather than blanking the UI; a real array
    // (even empty) replaces the cache. Throttled so day-hopping doesn't fire a server call per tap;
    // `force` skips the throttle where the user explicitly expects freshness (cold boot, tab return).
    let staticRefreshedAt = 0;
    const STATIC_REFRESH_MIN_MS = 60 * 1000;
    const refreshStaticFromServer = async (opts = {}) => {
      if (!opts.force && Date.now() - staticRefreshedAt < STATIC_REFRESH_MIN_MS) return;
      staticRefreshedAt = Date.now();
      const [hourTypes, contracts] = await Promise.all([run('api_getHourTypes'), run('api_getContracts')]);
      if (Array.isArray(hourTypes) && hourTypes.length) {
        state.hourTypes = hourTypes;
        state.hourTypeMap = hourTypes.reduce((map, ht) => { map[ht.id] = ht; return map; }, {});
      }
      if (Array.isArray(contracts)) state.contracts = contracts;
      persistCache();
      renderHourTypes();
      renderContracts();
      renderQuickEntryButton();
      renderDayCard();
    };

    // Returning to the tab silently resyncs the current day's entries from the server — replacing the
    // day wholesale so desktop-side deletes disappear too (mirrors desktop's tab-return auto-resync).
    // Skipped mid-save so an optimistic temp can't be clobbered; skipped on failure so a hiccup can't
    // blank a day that was fine.
    const refreshCurrentDayEntries = async () => {
      if (state.loading) return;
      const d = state.currentDate;
      const fresh = await run('api_getEntries', { startDate: d, endDate: d });
      if (!Array.isArray(fresh) || state.currentDate !== d || state.loading) return;
      state.entryCache[d] = fresh.map(sanitizeEntry).filter((e) => !(e && (e.entry_type === 'break' || e.entry_type === 'comment')));
      persistCache();
      state.entries = getCachedEntriesForDate(d);
      renderDayCard();
    };

    const hydrateDate = async (dateIso) => {
      const target = dateIso || todayIso();
      state.currentDate = target;
      if (dom.date) dom.date.value = target;
      if (dom.dateMain) dom.dateMain.textContent = formatDateLabel(target);
      if (dom.dateSub) dom.dateSub.textContent = formatDateSub(target);
      if (dom.dateToday) dom.dateToday.style.display = target === todayIso() ? 'none' : '';
      hydrateCacheFromStorage();
      hydrateFromDesktopCache();
      if (!state.prefetchedRange) state.prefetchedRange = derivePrefetchedRangeFromCache();
      if (!state.cacheHydrated) state.cacheHydrated = true;
      // Optimistic paint: immediately show whatever we already have cached for this date (often everything,
      // since adjacent days are prefetched in a range). Switching days snaps the new day's hours in rather
      // than leaving the previous day's showing under "Loading...". Always land on a blank add-form.
      state.entries = getCachedEntriesForDate(target);
      hydrateDraftFromEntry(null, { preserveMode: true });
      renderHourTypes();
      renderQuickEntryButton();
      renderDayCard();
      // Only show a loading hint when there was nothing cached to paint.
      if (!state.entries.length) setStatus('Loading...', 'info');
      await loadStaticData();
      await loadEntriesForDate(target);
      if (state.currentDate !== target) return; // user already moved to another day — don't clobber it
      renderHourTypes();
      renderQuickEntryButton();
      renderDayCard();
      hydrateDraftFromEntry(null, { preserveMode: true });
      setStatus('');
    };

    const findDuplicate = (payload) => {
      const key = entryCompositeKey(payload.date, payload.hour_type_id, payload.contract_id);
      return state.entries.find((e) => entryCompositeKey(e.date, e.hour_type_id, e.contract_id) === key && e.id !== payload.id) || null;
    };

    const getManualPayload = () => {
      const hoursRaw = dom.hours ? dom.hours.value.trim() : '';
      const totalHours = Number(hoursRaw);
      if (!Number.isFinite(totalHours) || totalHours <= 0) {
        setStatus('Enter total hours greater than zero.', 'error');
        return null;
      }
      const minutes = Math.round(totalHours * 60);
      if (minutes > 24 * 60) {
        setStatus('Hours must be within a single day.', 'error');
        return null;
      }
      const hourTypeId = state.selectedHourTypeId || defaultHourTypeId();
      const hourType = state.hourTypeMap[hourTypeId] || {};
      const contractId = dom.manualContract ? dom.manualContract.value : '';
      if (hourTypeNeedsContract(hourType)) {
        if (!contractId) {
          setStatus('Select a contract for this hour type.', 'error');
          return null;
        }
        const contract = state.contracts.find((c) => c.id === contractId);
        if (!contract || !contractIsValid(contract, state.currentDate)) {
          setStatus('Selected contract is not valid for this date.', 'error');
          return null;
        }
      }
      const rounded = roundDuration(minutes, roundInterval());
      return {
        id: state.currentEntry ? state.currentEntry.id : undefined,
        date: state.currentDate,
        punches: [{ in: '00:00', out: minutesToTime(rounded) }],
        duration_minutes: rounded,
        contract_id: contractId,
        hour_type_id: hourTypeId,
        round_interval: roundInterval(),
        entry_type: 'basic'
      };
    };

    const getPunchPayload = () => {
      const punches = normalizePunchList(state.draftPunches);
      if (!punches.length) {
        setStatus('Add at least one punch.', 'error');
        return null;
      }
      const validationError = validatePunches(punches);
      if (validationError) {
        setStatus(validationError, 'error');
        return null;
      }
      const hourTypeId = state.selectedHourTypeId || defaultHourTypeId();
      const hourType = state.hourTypeMap[hourTypeId] || {};
      const contractId = dom.punchContract ? dom.punchContract.value : '';
      if (hourTypeNeedsContract(hourType)) {
        if (!contractId) {
          setStatus('Select a contract for this hour type.', 'error');
          return null;
        }
        const contract = state.contracts.find((c) => c.id === contractId);
        if (!contract || !contractIsValid(contract, state.currentDate)) {
          setStatus('Selected contract is not valid for this date.', 'error');
          return null;
        }
      }
      const summary = summarizePunches(punches);
      const rounded = roundDuration(summary.totalMinutes, roundInterval());
      return {
        id: state.currentEntry ? state.currentEntry.id : undefined,
        date: state.currentDate,
        punches,
        duration_minutes: rounded,
        contract_id: contractId,
        hour_type_id: hourTypeId,
        round_interval: roundInterval(),
        entry_type: 'advanced'
      };
    };

    // Quick entry: surface the user's existing hour-type quick actions (the same ones configured via
    // "Show in quick actions") as one-tap presets, so phone logging matches what they know on desktop.
    const quickFillHourTypes = () => {
      const defId = defaultHourTypeId();
      // The default type always offers a quick action (its toggle is locked on in the editor); include it
      // even if stored data has the flag off, so the quick-fill bar is never empty. Mirrors desktop.
      const enabled = (state.hourTypes || []).filter((ht) => ht && (ht.quick_fill_enabled || ht.id === defId));
      if (!enabled.length) return [];
      const primary = enabled.filter((ht) => ht.id === defId);
      const rest = enabled.filter((ht) => ht.id !== defId);
      return primary.concat(rest);
    };

    // Hours a quick action logs: the type's own value, else the default type's, else the standard day.
    // Mirrors the desktop quickFillHoursForType fallback so the two never disagree.
    const quickFillHoursForType = (hourType) => {
      if (hourType && hourType.quick_fill_hours != null && hourType.quick_fill_hours > 0) return hourType.quick_fill_hours;
      const def = state.hourTypeMap[defaultHourTypeId()] || {};
      if (def.quick_fill_hours != null && def.quick_fill_hours > 0) return def.quick_fill_hours;
      return targetHoursPerDay();
    };

    // --- Day templates (a Detailed contract's saved days of sessions) ------------------------------
    // Mirrors desktop's normalizeStandardDayTemplates/contractStandardDayTemplates: parse + validate a
    // contract's standard_day_json into [{ name, comment, sessions: [{in,out,htId}] }], tolerating the
    // legacy v1 bare-session-array shape; templates with no complete session are dropped.
    const contractStandardDayTemplates = (contract) => {
      if (!contract || !contract.standard_day_json) return [];
      let parsed;
      try { parsed = JSON.parse(contract.standard_day_json || '[]'); } catch (e) { return []; }
      if (!Array.isArray(parsed)) return [];
      if (parsed.length && parsed[0] && !Array.isArray(parsed[0].sessions) && (parsed[0].in != null || parsed[0].out != null)) {
        parsed = [{ name: 'Standard day', sessions: parsed }];
      }
      return parsed.map((t) => ({
        name: ((t && typeof t.name === 'string') ? t.name : '').trim() || 'Standard day',
        comment: (t && typeof t.comment === 'string') ? t.comment.replace(/\s+/g, ' ').trim().slice(0, 200) : '',
        sessions: ((t && Array.isArray(t.sessions)) ? t.sessions : [])
          .map((s) => ({ in: (s && s.in) || '', out: (s && s.out) || '', htId: (s && (s.htId || s.hour_type_id)) || defaultHourTypeId() }))
          .filter((s) => s.in && s.out)
      })).filter((t) => t.sessions.length);
    };
    const applicableStandardDayTemplates = (contract) => contractStandardDayTemplates(contract)
      .map((template, index) => ({ template, index }))
      .filter((item) => entryModeSource() !== 'hour_type' || item.template.sessions.every((session) => {
        const ht = state.hourTypeMap[session.htId || defaultHourTypeId()];
        return hourTypeEffectiveEntryMode(ht) === 'detailed';
      }));
    const standardDayContractsForDate = (dateIso) => {
      const contracts = entryModeSource() === 'hour_type'
        ? validContractsForDate(dateIso)
        : validContractsForDateAndMode(dateIso, 'detailed');
      return contracts.filter((contract) => applicableStandardDayTemplates(contract).length > 0);
    };

    // Contracts a quick action may land on, by the same rules as desktop's quick menu.
    const quickContractCandidates = (hourType) => {
      if (!hourTypeNeedsContract(hourType)) return [];
      return hourType.quick_fill_mode === 'punch'
        ? validContractsForDateAndMode(state.currentDate, 'detailed', hourType.id)
        : validContractsForDateAndMode(state.currentDate, 'simple', hourType.id);
    };

    // Quick-fill types actually usable on the current day: punch types only on today (a punch is always
    // "now" — matches desktop), and needs-contract fill types only when a Simple-mode contract is valid
    // that day. Inapplicable actions are omitted entirely (James: don't grey them out, don't show them).
    const applicableQuickFillTypes = () => quickFillHourTypes().filter((ht) => {
      if (ht.quick_fill_mode === 'punch') return state.currentDate === todayIso();
      return !hourTypeNeedsContract(ht) || quickContractCandidates(ht).length > 0;
    });

    const renderQuickEntryButton = () => {
      if (!dom.quickBtn) return;
      dom.quickBtn.hidden = applicableQuickFillTypes().length === 0
        && standardDayContractsForDate(state.currentDate).length === 0;
    };

    // Pick a contract for a quick action: keep the form's current choice if it's a candidate, else the
    // first candidate, else none. Optional-contract types always go contract-less ("No contract").
    const resolveQuickContractId = (hourType) => {
      const candidates = quickContractCandidates(hourType);
      if (!candidates.length) return '';
      const current = dom.manualContract ? dom.manualContract.value : '';
      if (current && candidates.some((c) => c.id === current)) return current;
      return candidates[0].id;
    };

    // One quick-sheet row: icon + name (+ optional sub line) on the left, an hours/mode tag on the right.
    const buildQuickRow = ({ iconSvg, name, sub, tag, onTap }) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ts-m-qa';
      const ic = document.createElement('span');
      ic.className = 'ts-m-qa-ic';
      ic.innerHTML = iconSvg;
      const info = document.createElement('span');
      info.className = 'ts-m-qa-info';
      const nameEl = document.createElement('span');
      nameEl.className = 'ts-m-qa-name';
      nameEl.textContent = name;
      info.appendChild(nameEl);
      if (sub) {
        const subEl = document.createElement('span');
        subEl.className = 'ts-m-qa-sub';
        subEl.textContent = sub;
        info.appendChild(subEl);
      }
      const hrs = document.createElement('span');
      hrs.className = 'ts-m-qa-hrs';
      hrs.textContent = tag;
      btn.appendChild(ic);
      btn.appendChild(info);
      btn.appendChild(hrs);
      btn.addEventListener('click', onTap);
      return btn;
    };

    const QUICK_CLOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>';

    const renderQuickList = () => {
      if (!dom.quickList) return;
      dom.quickList.innerHTML = '';
      const types = applicableQuickFillTypes();
      // Day templates of every Detailed contract valid this day — the Sessions-side quick actions.
      const sdContracts = standardDayContractsForDate(state.currentDate);
      if (!types.length && !sdContracts.length) {
        const empty = document.createElement('p');
        empty.className = 'ts-m-qa-empty';
        empty.textContent = 'No quick actions yet. Turn on "Show in quick actions" for an hour type.';
        dom.quickList.appendChild(empty);
        return;
      }
      const addSection = (label) => {
        const sec = document.createElement('p');
        sec.className = 'ts-m-qa-sec';
        sec.textContent = label;
        dom.quickList.appendChild(sec);
      };
      // Section labels only when both kinds are present — a single-kind sheet needs no explaining.
      const bothKinds = types.length && sdContracts.length;
      if (bothKinds) addSection('Quick fill');
      types.forEach((hourType) => {
        dom.quickList.appendChild(buildQuickRow({
          iconSvg: hourTypeIconSvg(hourType.icon),
          name: hourType.name || 'Work',
          // Punch types log via the clock, not a fixed duration — show "Punch", not a misleading hours value.
          tag: hourType.quick_fill_mode === 'punch' ? 'Punch' : trimHours(String(quickFillHoursForType(hourType))) + 'h',
          onTap: () => handleQuickFill(hourType)
        }));
      });
      if (bothKinds) addSection('Day templates');
      sdContracts.forEach((contract) => {
        applicableStandardDayTemplates(contract).forEach(({ template: tpl, index: ti }) => {
          const totalMins = tpl.sessions.reduce((acc, s) => {
            const a = timeToMinutes(s.in); const b = timeToMinutes(s.out);
            return acc + ((a !== null && b !== null && b > a) ? (b - a) : 0);
          }, 0);
          dom.quickList.appendChild(buildQuickRow({
            iconSvg: QUICK_CLOCK_ICON,
            name: tpl.name,
            // Contract name only when more than one contract has templates this day (disambiguation).
            sub: sdContracts.length > 1 ? contract.name : '',
            tag: trimHours(formatHours(totalMins)) + 'h',
            onTap: () => applyDayTemplate(contract, ti)
          }));
        });
      });
    };

    const openQuickSheet = () => {
      if (!dom.quickSheet) return;
      renderQuickList();
      dom.quickSheet.style.display = 'flex';
    };

    const closeQuickSheet = () => {
      if (dom.quickSheet) dom.quickSheet.style.display = 'none';
    };

    // Start the clock straight from the quick sheet for a "Start punch" hour type — mirrors desktop's
    // quickPunchInForDate. Appends a new session to a completed punch of the same type, else starts fresh.
    // (Only reachable on today: renderQuickList hides punch types on other days.)
    const quickPunchIn = (hourType) => {
      if (!hourType || state.loading) return;
      const hourTypeId = hourType.id;
      const contractId = resolveQuickContractId(hourType);
      if (hourTypeNeedsContract(hourType) && !contractId) {
        closeQuickSheet();
        setStatus('Select a contract for this hour type.', 'error');
        return;
      }
      const nowTime = new Date().toTimeString().slice(0, 5);
      const existing = (state.entries || []).find((e) => e && e.date === state.currentDate
        && (e.hour_type_id || defaultHourTypeId()) === hourTypeId
        && (e.entry_type || 'basic') === 'advanced'
        && (e.contract_id || '') === (contractId || ''));
      const punches = existing ? (existing.punches || []).map((p) => ({ ...p })) : [];
      if (punches.some((p) => p && p.in && !p.out)) {
        closeQuickSheet();
        setStatus('Already on the clock.', 'info');
        return;
      }
      punches.push({ in: nowTime, out: '' });
      lastPunchInMs = Date.now();
      closeQuickSheet();
      savePunchEntry(existing, punches, hourTypeId, contractId);
      setStatus('Punched in at ' + to12h(nowTime), 'success');
    };

    // Log a quick action onto the current day: synthesise a basic entry from the type's quick-fill hours
    // and run it through the shared save path (duplicate guard, optimistic update, server confirm).
    const handleQuickFill = (hourType) => {
      if (!hourType || state.loading) return;
      if (hourType.quick_fill_mode === 'punch') { quickPunchIn(hourType); return; }
      const minutes = Math.round((quickFillHoursForType(hourType) || 0) * 60);
      if (!minutes) { closeQuickSheet(); return; }
      const contractId = resolveQuickContractId(hourType);
      if (hourTypeNeedsContract(hourType) && !contractId) {
        closeQuickSheet();
        setStatus('Select a contract for this hour type.', 'error');
        return;
      }
      const rounded = roundDuration(minutes, roundInterval());
      closeQuickSheet();
      saveEntry({
        date: state.currentDate,
        punches: [{ in: '00:00', out: minutesToTime(rounded) }],
        duration_minutes: rounded,
        contract_id: contractId,
        hour_type_id: hourType.id,
        round_interval: roundInterval(),
        entry_type: 'basic'
      });
    };

    // Apply one of a Detailed contract's day templates to the current day: group the template's sessions
    // by hour type → one advanced entry per (contract, hour type) carrying its punches, created via the
    // same dedup-safe api_addEntriesBulk path desktop uses. Optimistic: temps show at once and are
    // swapped for the server's confirmed rows (or dropped, when the server skipped them as duplicates).
    const applyDayTemplate = async (contract, tplIndex) => {
      if (state.loading || !contract) return;
      const tpl = contractStandardDayTemplates(contract)[tplIndex || 0];
      closeQuickSheet();
      if (!tpl) return;
      const dateIso = state.currentDate;
      const byHt = {};
      tpl.sessions.forEach((s) => { const ht = s.htId || defaultHourTypeId(); (byHt[ht] = byHt[ht] || []).push({ in: s.in, out: s.out }); });
      const payloads = Object.keys(byHt).map((ht) => ({
        date: dateIso, contract_id: contract.id, hour_type_id: ht,
        entry_type: 'advanced', punches_json: JSON.stringify(byHt[ht]), round_interval: roundInterval()
      }));
      setLoading(true);
      // Temps only for payloads with no matching entry yet — mirrors the server's (date, hour type,
      // contract) dedup key so nothing briefly double-shows that the server will skip.
      const tempIds = [];
      payloads.forEach((p, i) => {
        const dup = getCachedEntriesForDate(dateIso).some((e) => e
          && (e.hour_type_id || defaultHourTypeId()) === p.hour_type_id
          && (e.contract_id || '') === (p.contract_id || ''));
        if (dup) return;
        const temp = sanitizeEntry({ ...p, id: 'temp_tpl_' + Date.now() + '_' + i, created_at: isoDateTime(new Date()) });
        tempIds.push(temp.id);
        storeEntries([temp]);
      });
      state.entries = getCachedEntriesForDate(dateIso);
      renderDayCard();
      const res = await run('api_addEntriesBulk', { entries: payloads });
      // Drop the temps either way; the server's confirmed rows (if any) replace them below.
      state.entryCache[dateIso] = getCachedEntriesForDate(dateIso).filter((e) => tempIds.indexOf(e.id) === -1);
      if (res && res.success) {
        (res.entries || []).forEach((raw) => storeEntries([sanitizeEntry(raw)]));
        const added = res.added || 0;
        const dupes = res.duplicates || 0;
        if (added) {
          setStatus('Added ' + added + (added === 1 ? ' entry' : ' entries') + ' from “' + tpl.name + '”.', 'success');
          stampTemplateComment(dateIso, tpl.comment);
        } else {
          setStatus(dupes ? '“' + tpl.name + '” is already logged on this day.' : 'Nothing to add.', 'error');
        }
      } else {
        // No response — but GAS can return null on a transient hiccup even after persisting. Re-read the
        // day authoritatively and only flag an error if the entries truly didn't land (saveEntry's pattern).
        state.entryCache[dateIso] = [];
        await fetchEntriesRange(dateIso, dateIso);
        const landed = payloads.every((p) => getCachedEntriesForDate(dateIso).some((e) => e
          && (e.hour_type_id || defaultHourTypeId()) === p.hour_type_id
          && (e.contract_id || '') === (p.contract_id || '')));
        if (!landed) setStatus('Couldn’t apply “' + tpl.name + '”. Please try again.', 'error');
      }
      persistCache();
      if (state.currentDate === dateIso) {
        state.entries = getCachedEntriesForDate(dateIso);
        renderDayCard();
