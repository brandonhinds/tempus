<section class="ts-card" id="page-public-holidays" style="display:none; margin-bottom:16px;">
  <style>
    /* Public Holidays page — themed via design tokens so every theme stays coherent.
       Cards use the 12px panel radius; the state filter uses the 10px control radius;
       badges keep the reserved pill shape. */
    /* Header — heading sits alone on its own line, with the year + "Calendar" as a
       quieter subtitle beneath it (matches the reference mockup). */
    #page-public-holidays .ph-header { margin-bottom:32px; }
    /* This is a glanceable reference page, not a working surface — narrow the whole
       panel and centre it so the single column reads as a focused document rather than
       a tight strip lost in a full-width card. */
    #page-public-holidays { max-width:840px; margin-left:auto; margin-right:auto; }
    #page-public-holidays .ph-title { margin:0 0 10px; font-size:calc(var(--font-size-xl) + 6px); font-weight:700; letter-spacing:-0.02em; line-height:1.1; color:var(--text); }
    #page-public-holidays .ph-subtitle { margin:0; color:var(--muted); font-size:calc(var(--font-size-base) + 2px); font-weight:500; }


    /* State selector — control-radius buttons, soft-primary when active (theme-safe contrast) */
    #page-public-holidays .ph-state-filter { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
    /* This page deliberately breaks from the app's squarer-pill / rounder-badge house
       style and mirrors the reference instead: fully rounded state filters + squared-off
       state badges (see .ts-badge override below). Scoped here so the boxy reports etc.
       elsewhere are untouched. */
    #page-public-holidays .ph-state-btn {
      min-height:0; padding:8px 16px; border-radius:999px;
      border:1px solid var(--border); background:var(--panel); color:var(--muted);
      font-size:var(--font-size-sm); font-weight:600; cursor:pointer; box-shadow:none;
      transition:border-color .15s ease, color .15s ease, background .15s ease;
    }
    #page-public-holidays .ph-state-btn:hover { border-color:var(--primary-soft-border); color:var(--text); background:var(--hover-bg); box-shadow:none; }
    /* Active pill: full accent colour with white text, no border — clean and bold
       (matches the reference) rather than the washed-out soft tint. */
    #page-public-holidays .ph-state-btn.is-active {
      background:var(--primary); border-color:var(--primary); color:#fff;
    }
    #page-public-holidays .ph-state-btn.is-active:hover {
      background:var(--primary); border-color:var(--primary); color:#fff;
    }

    /* Single chronological column. The panel itself is narrowed (below) so the rows
       stay tight instead of stretching the date and status to opposite edges. */
    #page-public-holidays .ph-list { display:flex; flex-direction:column; gap:10px; }
    #page-public-holidays .ph-card {
      display:flex; align-items:center; gap:18px;
      background:var(--panel); border:1px solid var(--border); border-radius:12px;
      padding:14px 18px; transition:transform .2s ease, box-shadow .2s ease;
    }
    /* Gemini-style hover: a subtle lift + shadow rather than a background swap.
       Passed holidays are no longer dimmed — the "Passed" label already says so. */
    #page-public-holidays .ph-card:hover {
      transform:translateY(-2px);
      box-shadow:0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
    }
    #page-public-holidays .ph-card.is-today { border-color:var(--primary-soft-border); background:var(--primary-soft-bg); }

    #page-public-holidays .ph-date {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-width:56px; padding-right:18px; border-right:1px solid var(--border);
    }
    #page-public-holidays .ph-date-month { font-size:var(--font-size-xs); text-transform:uppercase; font-weight:700; letter-spacing:0.05em; color:var(--primary-soft-text); }
    #page-public-holidays .ph-date-day { font-size:calc(var(--font-size-xl) + 4px); font-weight:700; line-height:1; color:var(--text); margin-top:2px; }

    #page-public-holidays .ph-details { flex:1; min-width:0; }
    #page-public-holidays .ph-name { font-size:calc(18px * var(--ui-scale)); font-weight:600; color:var(--text); margin:0 0 4px; }
    #page-public-holidays .ph-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:var(--font-size-sm); color:var(--muted); }
    /* Squared-off state badges (vs the app's default fully-rounded .ts-badge pill) to
       match the reference — the inverse of the rounded state filters above. */
    #page-public-holidays .ph-meta .ts-badge { border-radius:5px; }

    /* Status emphasis: upcoming holidays read clearly, the next one (≤30 days) pops in
       the accent colour, and passed ones stay quiet — so "has it happened / how far off"
       is legible at a glance. */
    #page-public-holidays .ph-when { font-size:var(--font-size-sm); font-weight:600; color:var(--text); text-align:right; white-space:nowrap; }
    #page-public-holidays .ph-card.is-past .ph-when { color:var(--muted); font-weight:500; }
    #page-public-holidays .ph-when.is-soon { color:var(--primary-soft-text); font-weight:700; }

    #page-public-holidays .ph-loading { display:flex; align-items:center; justify-content:center; gap:10px; padding:var(--space-5); color:var(--muted); font-size:var(--font-size-sm); }
    #page-public-holidays .ph-loading svg { animation:ts-spin 1s linear infinite; }

    @media (max-width:560px) {
      #page-public-holidays .ph-card { flex-direction:column; align-items:flex-start; gap:10px; }
      #page-public-holidays .ph-date {
        flex-direction:row; align-items:baseline; gap:8px; min-width:0; width:100%;
        padding-right:0; padding-bottom:10px; border-right:none; border-bottom:1px solid var(--border);
      }
      #page-public-holidays .ph-when { text-align:left; }
    }
  </style>

  <header class="ph-header">
    <h2 class="ph-title">Public Holidays</h2>
    <p class="ph-subtitle" id="ph-subtitle">Calendar</p>
  </header>

  <nav class="ph-state-filter" id="ph-state-filter" aria-label="Filter by state or territory"></nav>

  <div id="ph-loading" class="ph-loading">
    <svg width="22" height="22" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="17" stroke="var(--border)" stroke-width="4"/><path d="M20 3a17 17 0 0 1 17 17" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/></svg>
    Loading public holidays…
  </div>

  <div id="ph-list" class="ph-list" aria-live="polite"></div>

  <div id="ph-empty" class="ts-empty-state" style="display:none;">
    <div class="ts-empty-state__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
    <p class="ts-empty-state__title">No public holidays found</p>
    <p class="ts-empty-state__text">There are no holidays recorded for this state and year yet. Try Refresh to re-check the source.</p>
  </div>
</section>
