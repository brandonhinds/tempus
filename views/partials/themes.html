<section class="ts-card ts-card--wide" id="page-themes" style="display:none;">
  <div class="ts-toolbar">
    <div class="ts-stack ts-stack--sm">
      <h3 style="margin:0;">Themes</h3>
      <p class="ts-note" style="margin:0;">Pick a theme, favourite the ones you love, or craft your own.</p>
    </div>
    <div class="ts-toolbar-actions" style="display:flex; align-items:center; gap:var(--space-3); justify-content:flex-end;">
      <button id="btn-new-theme-page" type="button">+ New theme</button>
    </div>
  </div>
  <label class="ts-toggle" style="margin-bottom:var(--space-4);">
    <input type="checkbox" id="set-logo-themed" />
    <span class="ts-toggle-track"><span class="ts-toggle-thumb"></span></span>
    <span style="font-size:var(--font-size-sm);">Colour the Tempus logo with the active theme's accent</span>
  </label>
  <div class="ts-theme-gallery ts-theme-gallery--page" id="theme-gallery"></div>
</section>
