<script>
  const lilState = { month: todayIso().slice(0,7), months: {}, selection: {}, editors: {}, pending: new Map(), failures: new Map(), chains: {}, generation: {}, checking: {}, hydrated: new Set(), epoch: 0, search: '', scroll: {}, last: {}, setupReturn: false };
  const lilEl = id => document.getElementById('lil-' + id);
  const lilEscape = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lilMoney = value => new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(Number(value)||0);
  const lilPercent = value => new Intl.NumberFormat('en-AU',{minimumFractionDigits:1,maximumFractionDigits:1}).format((Number(value)||0)*100)+'%';
  const lilHours = minutes => new Intl.NumberFormat('en-AU',{maximumFractionDigits:2}).format(Number(minutes||0)/60);
  const lilDate = (date, full) => date ? new Date(date+'T12:00:00').toLocaleDateString('en-AU',full?{day:'numeric',month:'long',year:'numeric'}:{day:'2-digit',month:'short'}) : 'Missing date';
  // The list row carries a weekday over a day-of-month numeral, the same shape as the agenda's day rows.
  const lilDateParts = date => {
    if(!date) return {weekday:'—',day:'—'};
    const value=new Date(date+'T12:00:00');
    return {weekday:value.toLocaleDateString('en-AU',{weekday:'short'}),day:String(value.getDate())};
  };
  const lilMonthLabel = month => new Date(month+'-01T12:00:00').toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  const lilRequestId = () => typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : generateTempId('lil')+'-'+Math.random().toString(36).slice(2);
  const lilData = () => lilState.months[lilState.month];
  const lilSelected = () => lilData()?.assessments.find(a=>a.id===lilState.selection[lilState.month]);
  function lilApi(method, ...args) {
    return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(result=>result?.success===false?reject(new Error(result.message||result.error||'Save not confirmed.')):resolve(result)).withFailureHandler(reject)[method](...args));
  }
  function lilFeedback(message, retry) {
    const target=lilEl('feedback'); target.replaceChildren(); target.hidden=!message;
    if(message) target.append(document.createTextNode(message));
    if(retry){const button=document.createElement('button');button.type='button';button.className='ghost small';button.textContent='Retry';button.addEventListener('click',retry);target.append(' ',button);}
  }
  function lilMonthPending(month) { return Array.from(lilState.pending.values()).some(op=>op.months.includes(month)); }
  function lilMonthFailed(month) { return Array.from(lilState.failures.values()).some(op=>op.months.includes(month)); }
  function lilMarkInvoiceChanged(month) { const data=lilState.months[month]; if(data?.invoice) data.invoice.stale=!!data.invoice.invoice?.generated_doc_id; }
  function lilSyncEntries(entries, deletedIds) {
    const ids=new Set((deletedIds||[]).concat((entries||[]).map(e=>e.id)));
    state.entries=(state.entries||[]).filter(e=>!ids.has(e.id));
    (entries||[]).forEach(e=>{const normalized=sanitizeEntry(e);state.entries.push(normalized);if(typeof recordPendingEntryAdd==='function'){recordPendingEntryAdd(normalized);resolveMarkerAfterSync(()=>resolvePendingEntryAdd(normalized.id));}});
    (deletedIds||[]).forEach(id=>{if(typeof recordPendingEntryDelete==='function') recordPendingEntryDelete(id);});
    state.entries.sort(entrySort);markAllIncomeSummariesDirty();saveCache();renderEntries();
  }
  // Contracts and hour types arrive with the month payload but belong to the whole app, so they are
  // adopted into `state` rather than kept per month. A cached month carries neither (the main browser
  // cache already holds them), hence the presence checks.
  function lilAdoptReferenceData(data) {
    if(Array.isArray(data.contracts)){state.contracts=data.contracts.map(sanitizeContract);updateContractMap();}
    if(Array.isArray(data.hour_types)){state.hourTypes=data.hour_types.map(sanitizeHourType);updateHourTypeMap();}
    if(data.saved_default_hour_type_id!==undefined)state.settings.assessment_time_hour_type_id=data.saved_default_hour_type_id||'';
  }
  // Lil works in this month and the one she is invoicing, so those two ride along in the app's browser
  // cache and paint before any round trip. Every other month is still fetched on demand.
  function lilCacheMonths() {
    const now=new Date(todayIso()+'T12:00:00');
    const key=(year,month)=>year+'-'+String(month+1).padStart(2,'0');
    const previous=new Date(now.getFullYear(),now.getMonth()-1,1);
    return [key(now.getFullYear(),now.getMonth()),key(previous.getFullYear(),previous.getMonth())];
  }
  // Read by saveCacheNow_ in scripts.html. A month with an unconfirmed save is skipped: optimistic state
  // is not server truth and must not be restored as if it were.
  function serializeAssessmentMonths() {
    const out={};
    lilCacheMonths().forEach(month=>{
      const data=lilState.months[month];
      if(!data||!Array.isArray(data.assessments)||lilMonthPending(month)||lilMonthFailed(month))return;
      const copy={...data};delete copy.contracts;delete copy.hour_types;
      out[month]=copy;
    });
    return out;
  }
  function lilPersist() { if(typeof saveCache==='function')saveCache(); }
  // A cached month paints at once, then confirms itself against the sheet once per session. A failure
  // leaves the cached view in place: this is a background check over data already on screen, so there is
  // nothing to report and nothing for the user to retry.
  async function lilRevalidate(month) {
    if(!lilState.hydrated.has(month))return;
    lilState.hydrated.delete(month);
    const epoch=lilState.epoch;
    try{
      const data=await lilApi('api_getAssessmentsForMonth',Number(month.slice(0,4)),Number(month.slice(5,7)));
      if(epoch!==lilState.epoch || lilMonthPending(month))return;
      lilState.months[month]=data;lilAdoptReferenceData(data);lilPersist();
      if(month===lilState.month)lilRender();
    }catch(error){
      console.warn('[Tempus assessments] Background refresh of '+month+' failed; the cached month stands:',error);
    }
  }
  // lilState.month is the source of truth; the toolbar shows it as the label on the month button, which
  // opens the same picker the calendar's month label does.
  function lilSetMonthControl(month) { lilEl('month-label').textContent=lilMonthLabel(month); }
  // Write markup only when it actually differs. .ts-income-breakdown, .ts-note and .ts-empty-state all
  // start at opacity:0 behind a fadeIn, so replacing a node with identical markup restarts that fade and
  // reads as a flash. lilRender() repaints the invoice panel whenever anything on the page changes —
  // selecting a row, typing in the search box — none of which alters the invoice, so most of those
  // repaints were rewriting byte-identical HTML.
  function lilPaint(host, html) {
    if(!host || host.__lilHtml===html)return false;
    host.__lilHtml=html;host.innerHTML=html;return true;
  }
  function lilStatCard(label, value, sub, hero) {
    return `<div class="ts-stat-card ts-stat-card--static${hero?' ts-stat-card--hero':''}">`
      + `<span class="ts-stat-card-label">${lilEscape(label)}</span>`
      + `<span class="ts-stat-card-value">${lilEscape(value)}</span>`
      + `<span class="ts-stat-card-subtext">${lilEscape(sub)}</span></div>`;
  }
  // Month totals use Time Entry's KPI strip, so the two screens open on the same shape.
  function lilRenderSummary(list) {
    const fees=list.reduce((sum,a)=>sum+a.fee,0),minutes=list.reduce((sum,a)=>sum+a.actual_minutes,0);
    lilEl('summary').innerHTML=lilStatCard('Assessments',String(list.length),'this month')
      +lilStatCard('Fees',lilMoney(fees),'excluding GST',true)
      +lilStatCard('Time logged',lilHours(minutes)+' h','non-billable, all months');
  }
  const lilSkeleton = count => '<div class="ts-asm-skeleton" aria-hidden="true"><span></span><span></span></div>'.repeat(count);
  function lilRenderLoading() {
    const month=lilState.month,label=lilMonthLabel(month);
    lilSetMonthControl(month);
    lilEl('add').disabled=true;
    lilEl('summary').innerHTML=lilSkeleton(3)+`<span class="ts-note ts-asm-loading-note" role="status">Loading ${lilEscape(label)}…</span>`;
    lilEl('list').innerHTML=lilSkeleton(3)+`<p class="ts-note" role="status">Loading ${lilEscape(label)}…</p>`;
    lilEl('detail').innerHTML='<p class="ts-note" role="status">Loading this month’s assessments…</p>';
    lilEl('invoice-title').textContent=label+' invoice';
    lilEl('invoice-status').textContent='Loading…';
    lilEl('invoice-status').className='ts-badge';
    lilEl('invoice-status').hidden=false;
    lilEl('invoice-meta').textContent='Checking this month’s invoice…';
    lilEl('historical-invoices').replaceChildren();
    lilEl('snapshot').hidden=true;
    lilEl('open-invoice').hidden=true;
    const button=lilEl('generate');button.disabled=true;button.textContent='Generate invoice';button.title='Loading '+label+'…';
  }
  async function renderAssessmentsPage(options) {
    if(!getFeatureFlag('enable_lil_assessments_mode') && !window.__TEMPUS_LIL_MODE__) return;
    const month=lilState.month;
    if(lilData() && !options?.force){lilRender();lilRevalidate(month);return;}
    const epoch=lilState.epoch, ticket=lilRequestId();
    lilState.fetchTicket=ticket;
    // Cached months repaint instantly above; only a month we have never read shows loading state.
    if(!lilData())lilRenderLoading(); else lilSetMonthControl(month);
    try {
      const data=await lilApi('api_getAssessmentsForMonth',Number(month.slice(0,4)),Number(month.slice(5,7)));
      if(epoch!==lilState.epoch || lilMonthPending(month)) return;
      lilState.months[month]=data;lilState.hydrated.delete(month);
      lilAdoptReferenceData(data);lilPersist();
      if(month===lilState.month && ticket===lilState.fetchTicket) lilRender();
    } catch(error){if(month===lilState.month){
        lilEl('add').disabled=false;
        lilEl('summary').innerHTML='';
        lilEl('list').innerHTML='<p class="ts-note">This month could not be loaded.</p>';
        lilEl('invoice-status').hidden=true;lilEl('invoice-meta').textContent='';
        lilFeedback(error.message||'Could not load this month.',()=>renderAssessmentsPage({force:true}));
      }}
  }
  // Rows are the agenda's day rows — a div[role=button], as there, so nothing has to undo the global
  // button pill. Status rides on a badge rather than a third line of appended grey text.
  function lilRowHtml(a) {
    const parts=lilDateParts(a.assessment_date),selected=a.id===lilState.selection[lilState.month];
    const pending=lilState.pending.has(a.id),failed=lilState.failures.has(a.id),blockers=(a.invoice_blockers||[]).length;
    const badge=pending?'<span class="ts-badge">Saving…</span>'
      :failed?'<span class="ts-badge error">Not confirmed</span>'
      :blockers?'<span class="ts-badge warn">Needs details</span>'
      :a.percentage_adjustment?`<span class="ts-badge">+${lilEscape(Number((a.percentage_adjustment*100).toFixed(4)))}%</span>`:'';
    const colour=state.contractMap?.[a.contract_id]?.color;
    const meta=[a.assessment_type_name,a.organisation,a.contract_name].filter(Boolean).join(' · ');
    const name=a.client_name||'Unnamed assessment';
    return `<div class="ts-agenda-row${selected?' is-selected':''}${failed||blockers?' is-open':''}" role="button" tabindex="0"`
      + ` data-assessment="${lilEscape(a.id)}" aria-current="${selected}" aria-label="${lilEscape(name+', '+lilDate(a.assessment_date,true)+', '+lilMoney(a.fee))}">`
      + `<div class="ts-agenda-row-date"><p class="ts-agenda-row-wd">${lilEscape(parts.weekday)}</p><p class="ts-agenda-row-day">${lilEscape(parts.day)}</p></div>`
      + `<div class="ts-agenda-row-sep"></div>`
      + `<div class="ts-agenda-row-main"><span class="ts-agenda-dot"${colour?` style="background:${lilEscape(typeof dataColor==='function'?dataColor(colour):colour)};"`:''}></span>`
      + `<div><p class="ts-agenda-row-type">${lilEscape(name)}${badge}</p>`
      + `<p class="ts-agenda-row-sub">${lilEscape(meta)}</p></div></div>`
      + `<div class="ts-asm-row-amount"><span class="ts-agenda-row-hours">${lilMoney(a.fee)}</span>`
      + `<p class="ts-agenda-row-sub">${a.actual_minutes?lilHours(a.actual_minutes)+' h logged':'No time logged'}</p></div>`
      + `<svg class="ts-agenda-row-chev" viewBox="0 0 8 12" fill="none" aria-hidden="true"><path d="M1.5 1l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      + `</div>`;
  }
  function lilRender(listOnly) {
    const data=lilData();if(!data)return;
    lilSetMonthControl(lilState.month);
    lilEl('add').disabled=false;
    const list=data.assessments.slice().sort((a,b)=>a.assessment_date.localeCompare(b.assessment_date)||a.client_name.localeCompare(b.client_name)||a.id.localeCompare(b.id));
    lilRenderSummary(list);
    const query=lilState.search.trim().toLowerCase(),filtered=list.filter(a=>(a.client_name+' '+a.organisation).toLowerCase().includes(query));
    lilEl('list').innerHTML=filtered.length?filtered.map(lilRowHtml).join('')
      :query?`<div class="ts-empty-state ts-empty-state--inline"><p class="ts-empty-state__title">Nothing matches “${lilEscape(lilState.search.trim())}”</p><p class="ts-empty-state__text">No client or organisation in ${lilEscape(lilMonthLabel(lilState.month))} matches your search.</p></div>`
      :`<div class="ts-empty-state"><div class="ts-empty-state__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7z"/><path d="M14 2v6h5M8 12h8M8 16h6"/></svg></div><p class="ts-empty-state__title">No assessments in ${lilEscape(lilMonthLabel(lilState.month))}</p><p class="ts-empty-state__text">Add an assessment to record its fee, log your time against it, and generate the monthly invoice.</p><div class="ts-empty-state__actions"><button type="button" id="lil-empty-add">Add assessment</button></div></div>`;
    if(lilEl('empty-add'))lilEl('empty-add').onclick=()=>lilEdit();
    lilEl('list').querySelectorAll('[data-assessment]').forEach(row=>{
      const open=()=>lilSelect(row.dataset.assessment);
      row.addEventListener('click',open);
      // role=button without keyboard activation is a button in name only.
      row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open();}});
    });
    lilRenderInvoice();if(!listOnly)lilRenderDetail();
  }
  function lilRenderInvoice() {
    const data=lilData();if(!data)return;
    const info=data.invoice||{},invoice=info.invoice,month=lilState.month,working=lilState.generation[month],checking=lilState.checking[month],pending=lilMonthPending(month),failed=lilMonthFailed(month);
    lilEl('invoice-title').textContent=lilMonthLabel(month)+' invoice';
    const status=lilEl('invoice-status');
    status.textContent=working?'Generating…':checking?'Checking…':invoice?.generated_doc_id?(info.stale?'Changes since generation':'Generated'):'Not generated';
    status.className='ts-badge'+(info.stale?' warn':invoice?.generated_doc_id?' success':'');
    status.hidden=false;
    // An assessment missing invoice details would fail generation server-side; say so up front.
    const incomplete=data.assessments.filter(a=>(a.invoice_blockers||[]).length);
    const blocked=info.warning||(incomplete.length?`${incomplete.length} assessment${incomplete.length===1?' needs':'s need'} details before this month can be invoiced: ${incomplete.slice(0,3).map(a=>a.client_name||'Unnamed assessment').join(', ')}${incomplete.length>3?` and ${incomplete.length-3} more`:''}.`:'');
    const summary=info.summary,generated=invoice?.generated_at?new Date(invoice.generated_at).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'}):'';
    // "All 0 assessments in August" is technically true and reads like a bug.
    lilEl('invoice-meta').textContent=blocked || (!data.assessments.length?`Add an assessment before ${lilMonthLabel(month)} can be invoiced.`:`All ${data.assessments.length} assessment${data.assessments.length===1?'':'s'} in ${lilMonthLabel(month)}${invoice?.invoice_number?' · Invoice '+invoice.invoice_number:''}${summary&&invoice?.generated_doc_id?' · '+lilMoney(summary.totalAmount)+' + '+lilMoney(summary.gstAmount)+' GST = '+lilMoney(summary.totalWithGst):' · Fees exclude GST'}${generated?' · generated '+generated:''}`);
    const open=lilEl('open-invoice'),url=/^https:\/\//.test(invoice?.generated_doc_url||'')?invoice.generated_doc_url:'';
    open.hidden=!url;open.onclick=url?(()=>window.open(url,'_blank','noopener')):null;
    const button=lilEl('generate');button.disabled=!!working||!!checking||!!info.generating||pending||failed||!data.assessments.length||!!blocked;button.textContent=pending?'Saving assessments…':working?'Generating…':checking?'Checking…':'Generate invoice';button.title=failed?'Resolve the unconfirmed save before generating.':blocked||`Generate an invoice for all assessments in ${lilMonthLabel(month)}`;
    lilRenderSnapshot(info);
    const historical=(info.historical_invoices||[]).filter(inv=>/^https:\/\//.test(inv.generated_doc_url||''));
    if(lilPaint(lilEl('historical-invoices'),historical.map(inv=>`<button type="button" class="ghost small" data-invoice-url="${lilEscape(inv.generated_doc_url)}">Open invoice ${lilEscape(inv.invoice_number)}</button>`).join('')))
      lilEl('historical-invoices').querySelectorAll('[data-invoice-url]').forEach(link=>link.onclick=()=>window.open(link.dataset.invoiceUrl,'_blank','noopener'));
  }
  // Frozen at generation, so it answers "how much of this is mine once it is paid". It goes out of date
  // when the month's invoice inputs change — not when time is logged, which never alters a fee.
  //
  // Presented as Time Entry's income waterfall (.ts-income-breakdown / .ts-income-row), because it is
  // the same question that screen answers: gross in at the top, what is held back in the middle, what is
  // actually yours at the bottom. The rows balance against the invoice total by construction —
  // income + retained_in_business === invoice_total — so the allocation bar and the percentages agree.
  function lilSnapshotRow(label, value, total, options) {
    const settings=options||{},pct=total?value/total:0;
    return `<div class="ts-income-row${settings.anchor?' ts-income-row--anchor':''}${settings.net?' ts-income-row--net':''}">`
      + `<span class="ts-income-row-label">${label}</span>`
      + `<span class="ts-income-row-actual">${settings.actual?lilEscape(settings.actual):''}</span>`
      + `<span class="ts-income-row-est${settings.muted?' ts-asm-stale-value':''}">${lilMoney(value)}</span>`
      + `<span class="ts-income-row-pct">${settings.bare?'':lilPercent(pct)}${settings.bare||!total?'':`<span class="ts-av-mini-bar"><span style="width:${Math.max(0,Math.min(100,pct*100)).toFixed(1)}%"></span></span>`}</span>`
      + `</div>`;
  }
  function lilRenderSnapshot(info) {
    const host=lilEl('snapshot'),snap=info&&info.snapshot;
    host.hidden=!snap;
    if(!snap){lilPaint(host,'');return;}
    const stale=!!info.stale,total=Number(snap.invoice_total)||0,muted=stale;
    const generated=info.invoice&&info.invoice.generated_at?new Date(info.invoice.generated_at).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'}):'';
    const gstHeld=snap.net_gst!=null?snap.net_gst:snap.gst;
    const credits=Number(snap.gst_credits)||0;
    const segment=(value,colour)=>`<div class="ts-income-bd-bar-seg" style="flex:${Math.max(0,Number(value)||0).toFixed(2)}; background:${colour};"></div>`;
    const legend=(label,colour)=>`<span class="ts-income-bd-legend-item"><span class="ts-income-bd-legend-dot" style="background:${colour};"></span>${label}</span>`;
    lilPaint(host,(stale?`<p class="ts-warning ts-asm-alert">These figures are from the invoice generated ${lilEscape(generated)}. This month has changed since — generate a new invoice to bring them up to date.</p>`:'')
      + `<div class="ts-income-breakdown">`
      + `<div class="ts-income-bd-viz">`
      +   `<div class="ts-income-bd-head"><span class="ts-income-bd-title">Where this invoice goes</span><span class="ts-income-bd-gross">${lilMoney(total)} including GST</span></div>`
      +   `<div class="ts-income-bd-bar">${segment(snap.income,'var(--chart-net)')}${segment(snap.tax,'var(--chart-tax)')}${segment(snap.super,'var(--chart-super)')}${segment(gstHeld,'var(--chart-gross)')}${segment(snap.expenses_paid,'var(--chart-deduct)')}</div>`
      +   `<div class="ts-income-bd-legend">${legend('Yours to transfer','var(--chart-net)')}${legend('Tax','var(--chart-tax)')}${legend('Super','var(--chart-super)')}${legend('GST','var(--chart-gross)')}${legend('Business expenses','var(--chart-deduct)')}</div>`
      + `</div>`
      + `<div class="ts-income-bd-colhead"><span></span><span></span><span>Amount</span><span>% of invoice</span></div>`
      + lilSnapshotRow('Invoice total',total,total,{anchor:true,bare:true,muted:muted})
      + lilSnapshotRow('Fees excluding GST',snap.fees_ex_gst,total,{muted:muted})
      + lilSnapshotRow('GST collected',snap.gst,total,{muted:muted})
      + `<div class="ts-income-divider"></div>`
      + lilSnapshotRow('GST held'+(credits?` <span class="ts-info-icon" role="button" tabindex="0" aria-label="GST collected, less the credit already claimed on this month’s expenses" data-tip="GST collected, less the ${lilEscape(lilMoney(credits))} credit already claimed on this month’s expenses.">i</span>`:''),gstHeld,total,{muted:muted})
      + lilSnapshotRow('Business expenses <span class="ts-info-icon" role="button" tabindex="0" aria-label="This month’s company expenses, including GST" data-tip="This month’s company expenses, including GST. Manage them on the Expenses page.">i</span>',snap.expenses_paid||0,total,{muted:muted})
      + lilSnapshotRow('Super set aside',snap.super,total,{actual:lilPercent(snap.super_rate)+' of '+lilMoney(snap.profit_before_super),muted:muted})
      + lilSnapshotRow('Tax set aside',snap.tax,total,{actual:'on '+lilMoney(snap.taxable_profit)+' taxable',muted:muted})
      + lilSnapshotRow('Stays in business',snap.retained_in_business,total,{anchor:true,muted:muted})
      + `<div class="ts-income-divider"></div>`
      + lilSnapshotRow('Yours to transfer once paid',snap.income,total,{anchor:true,net:!stale,muted:muted})
      + `</div>`
      + `<div class="ts-asm-note-stack">`
      + (stale?'':'<p class="ts-note">GST, tax, super and this month’s business expenses stay in the business account. Logging time never changes these figures.</p>')
      + (snap.warnings||[]).map(text=>`<p class="ts-note">${lilEscape(text)}</p>`).join('')
      + `</div>`);
  }
  function lilOpenDetail() { lilState.scroll[lilState.month]=window.scrollY;lilEl('workspace').classList.add('has-detail'); }
  function lilBack() { lilEl('workspace').classList.remove('has-detail');window.scrollTo({top:lilState.scroll[lilState.month]||0});lilEl('list').querySelector('[aria-current="true"]')?.focus({preventScroll:true}); }
  async function lilSelect(id) {
    if(lilState.editors[lilState.month] && !(await customConfirm('Discard this unsaved assessment draft?',{title:'Open another assessment?',okText:'Discard draft'})))return;
    delete lilState.editors[lilState.month];lilState.selection[lilState.month]=id;lilOpenDetail();lilRender();
  }
  // Detail is the Time Entry day editor, section for section: the .ts-entry-editing header with its
  // figure on the right, then .ts-day-editor-section blocks, then the day editor's own list for both the
  // fee lines and the hours. Clicking an hour row expands the editor in place, as it does there.
  function lilTimeSectionHtml(a) {
    const types=state.hourTypeMap||{},eligible=state.hourTypes.filter(t=>t.contributes_to_income===false);

    };
    host.querySelector('select')?.focus();
    const form=lilEl('time-form');
    const capture=event=>{const target=event.target,cell=target.closest?target.closest('[data-row]'):null;
      if(!cell||!target.name)return;const index=Number(cell.dataset.row);if(rows[index])rows[index][target.name]=target.value;};
    form.oninput=capture;form.onchange=capture;
    form.onsubmit=event=>{
      event.preventDefault();
      if(!form.reportValidity())return;
      const prepared=[];
      for(const row of rows){
        const minutes=Math.round(Number(row.hours)*60);
        if(!Number.isFinite(minutes)||minutes<1){lilFeedback('Enter hours that round to at least one minute on every day.');return;}
        if(!row.hour_type_id){lilFeedback('Choose a non-billable hour type on every day.');return;}
        if(!row.date){lilFeedback('Enter the date worked on every day.');return;}
        prepared.push({...row,duration_minutes:minutes});
      }
      const month=lilState.month,old=a.time_entries.slice();
      const total=list=>list.reduce((sum,item)=>sum+Number(item.duration_minutes||0),0);
      const optimistic=prepared.map(row=>({id:row.id||row.client_request_id,client_request_id:row.client_request_id,hour_type_id:row.hour_type_id,
        date:row.date,duration_minutes:row.duration_minutes,source_type:'assessment',source_id:a.id,assessment_id:a.id,
        source_occurrence_key:'',entry_type:'basic',contract_id:a.contract_id}));
      const replacing=new Set(optimistic.map(item=>item.id));
      const apply=()=>{a.time_entries=a.time_entries.filter(e=>!replacing.has(e.id)).concat(optimistic);a.actual_minutes=total(a.time_entries);};
      const save=async()=>{
        const saved=[];
        // One row at a time: each call takes the assessment lock, and a failure part-way must not hide
        // the rows that did commit.
        for(const row of prepared){
          try{ saved.push((await lilApi('api_upsertAssessmentTimeEntry',{assessment_id:a.id,id:row.id||'',client_request_id:row.client_request_id,
            hour_type_id:row.hour_type_id,date:row.date,hours:row.duration_minutes/60})).entry); }
          catch(error){ error.partial=saved; throw error; }
        }
        return saved;
      };
      const settle=saved=>{a.time_entries=a.time_entries.filter(e=>!replacing.has(e.id)).concat(saved);a.actual_minutes=total(a.time_entries);lilSyncEntries(saved);};
      const revert=error=>{
        // Keep whatever actually committed and re-open the form with only the days still unsaved.
        const saved=(error&&error.partial)||[];
        const savedRequests=new Set(saved.map(item=>String(item.client_request_id||'')));
        const savedIds=new Set(saved.map(item=>item.id));
        a.time_entries=old.filter(e=>!savedIds.has(e.id)).concat(saved);
        a.actual_minutes=total(a.time_entries);
        if(saved.length)lilSyncEntries(saved);
        const remaining=prepared.filter(row=>!savedRequests.has(String(row.client_request_id)));
        setTimeout(()=>{if(lilSelected()?.id===a.id)lilTimeForm(a,entry,remaining.length?remaining:null);},0);
      };
      const run=()=>lilOperation(a.id,[month],apply,save,settle,revert,run);run();
    };
  }
  async function lilDeleteTime(a,entry) {
    if(!(await customConfirm(`Delete ${lilHours(entry.duration_minutes)} hours worked on ${lilDate(entry.date,true)}?`,{title:'Delete time entry?',okText:'Delete hours',danger:true})))return;
    const month=lilState.month,old=a.time_entries.slice(),oldMinutes=a.actual_minutes;
    const run=()=>lilOperation(a.id,[month],()=>{a.time_entries=a.time_entries.filter(e=>e.id!==entry.id);a.actual_minutes=a.time_entries.reduce((s,e)=>s+Number(e.duration_minutes),0);},()=>lilApi('api_deleteAssessmentTimeEntry',{id:entry.id,assessment_id:a.id}),()=>lilSyncEntries([],[entry.id]),()=>{a.time_entries=old;a.actual_minutes=oldMinutes;},run);run();
  }
  async function lilRefreshInvoice(month) {
    if(!lilState.months[month])return;
    try{const info=await lilApi('api_getLilInvoiceGeneration',Number(month.slice(0,4)),Number(month.slice(5,7)));if(!lilMonthPending(month)){lilState.months[month].invoice=info;lilPersist();}if(month===lilState.month)lilRenderInvoice();}catch(error){if(month===lilState.month)lilFeedback('Could not refresh the invoice status. '+(error.message||''),()=>lilRefreshInvoice(month));}
  }
  async function lilGenerate(existingRequest) {
    const month=lilState.month,data=lilData();if(!data||lilState.generation[month]||lilState.checking[month]||lilMonthPending(month)||lilMonthFailed(month))return;
    // Acknowledge the click before the pre-flight refresh: that refresh is a round trip, so the action
    // must not sit there looking inert while it runs.
    lilState.checking[month]=true;lilRenderInvoice();
    // Refresh saved content/revision first; search only filters the list, never the invoice scope.
    try{ await lilRefreshInvoice(month); } finally { delete lilState.checking[month]; if(month===lilState.month)lilRenderInvoice(); }
    const info=data.invoice,invoice=info?.invoice;
    if(invoice?.generated_doc_id && !existingRequest && !(await customConfirm(`This will replace the generated invoice with all ${data.assessments.length} assessments currently in ${lilMonthLabel(month)}. Manual edits to the generated document will be lost. Copies you have already downloaded or sent will not change.`,{title:`Replace the ${lilMonthLabel(month)} invoice?`,okText:'Replace invoice'})))return;
    const request=existingRequest||{year:Number(month.slice(0,4)),month:Number(month.slice(5,7)),request_id:lilRequestId(),expected_hash:info.content_hash,confirmed_document_id:invoice?.generated_doc_id||''};
    lilState.generation[month]=request;lilRenderInvoice();lilFeedback('');
    try{const result=await lilApi('api_generateLilMonthlyInvoice',request);data.invoice.invoice=result.invoice;data.invoice.stale=false;await lilRefreshInvoice(month);if(state.companyTrackingEnabled)loadInvoicesList();}
    catch(error){
      // A lost response may still have committed. Read state before offering the same request again.
      await lilRefreshInvoice(month);
      if(data.invoice?.invoice?.generation_request_id!==request.request_id)lilFeedback(error.message||'Generation was not confirmed. Your previous invoice is still available.',()=>lilGenerate(request));
    }finally{delete lilState.generation[month];if(month===lilState.month)lilRenderInvoice();}
  }
  function lilChangeMonth(month) {
    if(!/^\d{4}-\d{2}$/.test(month))return;
    lilState.month=month;lilState.search='';lilEl('search').value='';lilEl('workspace').classList.remove('has-detail');lilFeedback('');renderAssessmentsPage({force:!lilState.months[month]});
  }
  function lilSetup(page) {
    lilState.setupReturn=true;showPage(page);
    const target=document.getElementById('page-'+page);if(!target)return;
    let back=document.getElementById('lil-setup-return');if(back)back.remove();back=document.createElement('button');back.id='lil-setup-return';back.className='ghost';back.textContent='Back to assessment';back.type='button';target.prepend(back);
    back.onclick=()=>{back.remove();lilState.setupReturn=false;showPage('assessments');const draft=lilState.editors[lilState.month];if(draft)lilRenderForm(draft);};
  }
  lilEl('add').onclick=()=>{if(lilData())lilEdit();};lilEl('today').onclick=()=>lilChangeMonth(todayIso().slice(0,7));
  // The month button opens the calendar's own month picker, so both screens jump months the same way.
  lilEl('month-btn').onclick=event=>{
    event.stopPropagation();
    if(typeof openMonthPickerFor!=='function')return;
    openMonthPickerFor(lilEl('month-btn'),{year:Number(lilState.month.slice(0,4)),month:Number(lilState.month.slice(5,7))-1},
      (year,month)=>lilChangeMonth(year+'-'+String(month+1).padStart(2,'0')));
  };
  [['prev',-1],['next',1]].forEach(([id,delta])=>lilEl(id).onclick=()=>{const d=new Date(lilState.month+'-01T12:00:00');d.setMonth(d.getMonth()+delta);lilChangeMonth(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));});
  lilEl('search').oninput=e=>{lilState.search=e.target.value;lilRender(true);};lilEl('generate').onclick=()=>lilGenerate();
  // loadCache() parked the restored months on state before this partial existed; adopt them now, keeping
  // only the two that are still current — reopening after a couple of months away must not resurrect a
  // month that is no longer cacheable.
  (function(){
    const cached=state.assessmentMonths;
    if(!cached||typeof cached!=='object')return;
    const allowed=new Set(lilCacheMonths());
    Object.keys(cached).forEach(month=>{
      const data=cached[month];
      if(!allowed.has(month)||!data||!Array.isArray(data.assessments))return;
      lilState.months[month]=data;lilState.hydrated.add(month);
    });
  })();
  if(state.currentPage==='assessments')renderAssessmentsPage();
  function lilSyncHourDefaultControl(hourType) {
    const row=document.getElementById('hour-type-assessment-default-row'),toggle=document.getElementById('hour-type-assessment-default');
    if(!row||!toggle)return;
    row.hidden=!getFeatureFlag('enable_lil_assessments_mode')||!!hourType?.contributes_to_income;
    toggle.checked=!!hourType?.id && state.settings.assessment_time_hour_type_id===hourType.id;
    toggle.disabled=!hourType?.id;
    document.getElementById('hour-type-assessment-default-help').textContent=hourType?.id?'Preselected when you log time against an assessment.':'Save this non-billable hour type to make it the assessment default.';
    toggle.onchange=async()=>{
      const previous=state.settings.assessment_time_hour_type_id||'',next=toggle.checked?hourType.id:'';
      state.settings.assessment_time_hour_type_id=next;toggle.disabled=true;renderHourTypes();
      Object.values(lilState.months).forEach(data=>data.default_hour_type_id=next);
      try{await lilApi('api_setAssessmentTimeDefault',next);saveCache();}
      catch(error){state.settings.assessment_time_hour_type_id=previous;toggle.checked=previous===hourType.id;Object.values(lilState.months).forEach(data=>data.default_hour_type_id=previous);setStatus(error.message||'Could not save assessment default','error');}
      finally{toggle.disabled=false;renderHourTypes();}
    };
  }
  document.getElementById('hour-type-contributes-income')?.addEventListener('change',event=>{
    const row=document.getElementById('hour-type-assessment-default-row');if(row)row.hidden=event.target.checked||!getFeatureFlag('enable_lil_assessments_mode');
  });
  document.getElementById('contract-assessment-organisations')?.addEventListener('input',event=>{
    document.getElementById('contract-organisations-preview').textContent=lilOrganisations(event.target.value).join(' · ')||'No organisation options yet.';
  });
</script>
