<script>
  const operationsState = { expenseTab:'transactions', transactions:[], rules:[], expenseMode:'transaction', expenseEditId:'' };

  function operationsApi(name, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name](...args);
    });
  }

  function operationsMoney(value) {
    return new Intl.NumberFormat('en-AU', { style:'currency', currency:'AUD' }).format(Number(value) || 0);
  }

  function operationsStatus(message, kind) {
    if (typeof setStatus === 'function') setStatus(message, kind || 'ok');
  }

  function ledgerText(parent, className, text) {
    const el = document.createElement('div');
    el.className = className;
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }

  async function renderExpensesPage() {
    const list = document.getElementById('expense-transactions');
    if (!list) return;
    list.replaceChildren(ledgerText(document.createDocumentFragment(), '', ''));
    list.textContent = 'Loading expense ledger…';
    try {
      const filters={from:document.getElementById('expense-filter-from')?.value||'',to:document.getElementById('expense-filter-to')?.value||'',reconciliation_state:document.getElementById('expense-filter-state')?.value||''};
      const [transactions, rules] = await Promise.all([operationsApi('api_listExpenseTransactions', filters), operationsApi('api_listExpenseRules', { include_inactive:true })]);
      operationsState.transactions = transactions || [];
      operationsState.rules = rules || [];
      renderExpenseTransactions();
      renderExpenseRules();
      await renderExpenseReport();
    } catch (error) {
      list.textContent = error && error.message ? error.message : 'Could not load expenses.';
    }
  }

  function renderExpenseTransactions() {
    const list = document.getElementById('expense-transactions');
    list.replaceChildren();
    if (!operationsState.transactions.length) {
      ledgerText(list, 'ts-empty', 'No expense transactions yet. Record a purchase to start the ledger.');
      return;
    }
    operationsState.transactions.forEach((transaction) => {
      const row = document.createElement('div');
      row.className = 'ts-ledger-row';
      const identity = document.createElement('div');
      ledgerText(identity, 'ts-ledger-row__title', transaction.vendor || transaction.description || 'Untitled expense');
      ledgerText(identity, 'ts-ledger-row__meta', [transaction.purchase_date, transaction.category, transaction.gst_code].filter(Boolean).join(' · '));
      row.appendChild(identity);
      ledgerText(row, 'ts-ledger-row__meta', String(transaction.reconciliation_state || 'unreconciled').replace(/_/g, ' '));
      ledgerText(row, 'ts-ledger-row__amount', operationsMoney(transaction.amount));
      const actions = document.createElement('div');
      actions.className = 'ts-ledger-row__actions';
      if (transaction.status === 'scheduled') { const record=document.createElement('button'); record.type='button'; record.className='ghost small'; record.textContent='Record purchase'; record.addEventListener('click',async()=>{ const result=await operationsApi('api_upsertExpenseTransaction',{...transaction,status:'recorded',reconciliation_state:'unreconciled'}); if(result.success===false)operationsStatus(result.message,'warn'); else renderExpensesPage(); }); actions.appendChild(record); }
      if (transaction.reconciliation_state !== 'reconciled' && transaction.status !== 'void') { const edit=document.createElement('button'); edit.type='button'; edit.className='ghost small'; edit.textContent='Edit'; edit.addEventListener('click',()=>openExpenseForm('transaction',transaction)); actions.appendChild(edit); }
      const receipt = document.createElement('button');
      receipt.type = 'button'; receipt.className = 'ghost small'; receipt.textContent = transaction.attachments && transaction.attachments.length ? 'Receipt ✓' : 'Add receipt';
      receipt.addEventListener('click', () => showExpenseInlineAction(row, transaction, 'receipt'));
      const payment = document.createElement('button');
      payment.type = 'button'; payment.className = 'ghost small'; payment.textContent = 'Payment';
      payment.disabled = transaction.status === 'scheduled' || transaction.status === 'void';
      payment.addEventListener('click', () => showExpenseInlineAction(row, transaction, 'payment'));
      const reconcile = document.createElement('button');
      reconcile.type = 'button'; reconcile.className = 'ghost small'; reconcile.textContent = transaction.reconciliation_state === 'reconciled' ? 'Reconciled' : 'Reconcile';
      reconcile.disabled = transaction.reconciliation_state === 'reconciled' || transaction.status === 'scheduled' || transaction.status === 'void';
      reconcile.addEventListener('click', () => showExpenseInlineAction(row, transaction, 'reconcile'));
      actions.append(receipt, payment, reconcile);
      if (transaction.status !== 'void' && transaction.status !== 'scheduled') { const voidButton=document.createElement('button'); voidButton.type='button'; voidButton.className='ghost small'; voidButton.textContent='Void'; voidButton.addEventListener('click',async()=>{ if(!voidButton.dataset.confirm){voidButton.dataset.confirm='1';voidButton.textContent='Confirm void';return;} const result=await operationsApi('api_voidExpenseTransaction',{id:transaction.id,reason:'Voided from expense ledger'}); if(result.success===false)operationsStatus(result.message,'warn'); else renderExpensesPage(); }); actions.appendChild(voidButton); }
      row.appendChild(actions);
      list.appendChild(row);
    });
  }

  function showExpenseInlineAction(row, transaction, mode) {
    row.parentElement.querySelectorAll('.ts-ledger-inline').forEach((el) => el.remove());
    const panel = document.createElement('form');
    panel.className = 'ts-ledger-inline';
    panel.style.gridColumn = '1 / -1';
    panel.style.display = 'flex'; panel.style.gap = '8px'; panel.style.alignItems = 'end'; panel.style.flexWrap = 'wrap';
    const input = document.createElement('input');
    input.required = true;
    if (mode === 'receipt') { input.type = 'url'; input.placeholder = 'https://… receipt link'; input.setAttribute('aria-label', 'Receipt URL'); }
    if (mode === 'payment') { input.type = 'number'; input.min = '0.01'; input.step = '0.01'; input.placeholder = 'Amount paid'; input.setAttribute('aria-label', 'Payment amount'); }
    const date = document.createElement('input');
    date.type = 'date'; date.value = transaction.purchase_date || ''; date.required = true; date.setAttribute('aria-label', 'Payment date');
    if (mode !== 'payment') date.hidden = true;
    const submit = document.createElement('button'); submit.type = 'submit'; submit.textContent = mode === 'reconcile' ? 'Confirm reconciliation' : 'Save';
    const cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'ghost'; cancel.textContent = 'Cancel'; cancel.addEventListener('click', () => panel.remove());
    if (mode !== 'reconcile') panel.append(input);
    panel.append(date, submit, cancel);
    panel.addEventListener('submit', async (event) => {
      event.preventDefault(); submit.disabled = true;
      let result;
      if (mode === 'receipt') result = await operationsApi('api_attachExpenseReceipt', { expense_transaction_id:transaction.id, url:input.value, name:'Receipt' });
      else if (mode === 'payment') result = await operationsApi('api_addExpensePayment', { expense_transaction_id:transaction.id, payment_date:date.value, amount:Number(input.value) });
      else result = await operationsApi('api_reconcileExpenseTransaction', { id:transaction.id, claimable_gst_confirmed:transaction.gst_code === 'taxable' });
      if (result && result.success === false) { operationsStatus(result.message, 'warn'); submit.disabled = false; return; }
      operationsStatus(mode === 'reconcile' ? 'Expense reconciled' : 'Expense evidence updated');
      await renderExpensesPage();
    });
    row.appendChild(panel);
    if (mode !== 'reconcile') input.focus(); else submit.focus();
  }

  function renderExpenseRules() {
    const list = document.getElementById('expense-rules');
    list.replaceChildren();
    if (!operationsState.rules.length) { ledgerText(list, 'ts-empty', 'No scheduled expense rules.'); return; }
    operationsState.rules.forEach((rule) => {
      const row = document.createElement('div'); row.className = 'ts-ledger-row';
      const identity = document.createElement('div'); ledgerText(identity, 'ts-ledger-row__title', rule.vendor || rule.description || 'Untitled rule'); ledgerText(identity, 'ts-ledger-row__meta', [rule.frequency, rule.start_date, rule.active === true || String(rule.active).toLowerCase() === 'true' ? 'active' : 'archived'].join(' · ')); row.appendChild(identity);
      ledgerText(row, 'ts-ledger-row__meta', rule.category || 'Uncategorised'); ledgerText(row, 'ts-ledger-row__amount', operationsMoney(rule.amount));
      const actions = document.createElement('div'); actions.className = 'ts-ledger-row__actions';
      const edit=document.createElement('button'); edit.type='button'; edit.className='ghost small'; edit.textContent='Edit future rule'; edit.addEventListener('click',()=>openExpenseForm('rule',rule)); actions.appendChild(edit);
      if (rule.active === true || String(rule.active).toLowerCase() === 'true') { const archive = document.createElement('button'); archive.type='button'; archive.className='ghost small'; archive.textContent='Archive'; archive.addEventListener('click', async () => { const result = await operationsApi('api_archiveExpenseRule', rule.id); if (result.success === false) operationsStatus(result.message, 'warn'); else renderExpensesPage(); }); actions.appendChild(archive); }
      row.appendChild(actions); list.appendChild(row);
    });
  }

  async function renderExpenseReport() {
    const target = document.getElementById('expense-report');
    const fyInput = document.getElementById('expense-report-fy');
    if (!target || !fyInput) return;
    if (!fyInput.value) { fyInput.value = financialYearStartYear(new Date()); }
    const report = await operationsApi('api_getExpenseReport', { financial_year:Number(fyInput.value) });
    target.replaceChildren();
    [['Actual', report.totals.actual], ['Scheduled', report.totals.scheduled], ['Unreconciled', report.totals.unreconciled], ['GST creditable', report.totals.gst_creditable], ['Non-creditable GST', report.totals.non_creditable_gst]].forEach(([label, value]) => { const item=document.createElement('div'); ledgerText(item, 'ts-ledger-row__meta', label); const strong=document.createElement('strong'); strong.textContent=operationsMoney(value); item.appendChild(strong); target.appendChild(item); });
  }

  function openExpenseForm(mode, item) {
    operationsState.expenseMode = mode;
    operationsState.expenseEditId=item&&item.id?item.id:'';
    const form = document.getElementById('expense-form'); form.style.display='block'; form.reset();
    document.getElementById('expense-vendor').value=item?.vendor||''; document.getElementById('expense-abn').value=item?.vendor_abn||''; document.getElementById('expense-description').value=item?.description||''; document.getElementById('expense-category').value=item?.category||''; document.getElementById('expense-amount').value=item?.amount??''; document.getElementById('expense-gst-code').value=item?.gst_code||'taxable'; document.getElementById('expense-notes').value=item?.notes||'';
    document.getElementById('expense-business-use').value=item?Math.round((Number(item.business_use_percentage)||0)*10000)/100:100;
    document.getElementById('expense-date').value=(mode==='rule'?item?.start_date:item?.purchase_date)||new Date().toISOString().slice(0,10); document.getElementById('expense-supplier-date').value=item?.supplier_invoice_date||''; document.getElementById('expense-frequency').value=item?.frequency||'monthly';
    document.getElementById('expense-frequency-wrap').style.display=mode === 'rule' ? 'block' : 'none';
    document.getElementById('expense-supplier-date-wrap').style.display=mode === 'rule' ? 'none' : 'block';
    form.querySelector('h4').textContent=(item?'Edit ':'New ')+(mode === 'rule' ? 'scheduled expense rule' : 'expense transaction');
    document.getElementById('expense-vendor').focus();
  }

  document.getElementById('expense-add')?.addEventListener('click',()=>openExpenseForm('transaction'));
  document.getElementById('expense-rule-add')?.addEventListener('click',()=>openExpenseForm('rule'));
  document.getElementById('expense-form-cancel')?.addEventListener('click',()=>document.getElementById('expense-form').style.display='none');
  document.getElementById('expense-form')?.addEventListener('submit',async(event)=>{ event.preventDefault(); const payload={ id:operationsState.expenseEditId||'', vendor:document.getElementById('expense-vendor').value, vendor_abn:document.getElementById('expense-abn').value, description:document.getElementById('expense-description').value, category:document.getElementById('expense-category').value, amount:Number(document.getElementById('expense-amount').value), gst_code:document.getElementById('expense-gst-code').value, business_use_percentage:Number(document.getElementById('expense-business-use').value), purchase_date:document.getElementById('expense-date').value, supplier_invoice_date:document.getElementById('expense-supplier-date').value, start_date:document.getElementById('expense-date').value, frequency:document.getElementById('expense-frequency').value, notes:document.getElementById('expense-notes').value, active:true }; const api=operationsState.expenseMode==='rule'?'api_upsertExpenseRule':'api_upsertExpenseTransaction'; const result=await operationsApi(api,payload); if(result.success===false){operationsStatus(result.message,'warn');return;} event.currentTarget.style.display='none'; operationsState.expenseEditId=''; operationsStatus(operationsState.expenseMode==='rule'?'Expense rule saved':'Expense recorded'); renderExpensesPage(); });
  document.getElementById('expense-filter-apply')?.addEventListener('click',renderExpensesPage);
  document.getElementById('expense-rule-generate')?.addEventListener('click',async()=>{const end=new Date();end.setFullYear(end.getFullYear()+1);const result=await operationsApi('api_generateExpenseRuleOccurrences',{through_date:end.toISOString().slice(0,10)});if(result.success===false)operationsStatus(result.message,'warn');else{operationsStatus(`${result.created_count} scheduled expense${result.created_count===1?'':'s'} created`);renderExpensesPage();}});
  document.querySelectorAll('[data-expense-tab]').forEach((button)=>button.addEventListener('click',()=>{ operationsState.expenseTab=button.dataset.expenseTab; document.querySelectorAll('[data-expense-tab]').forEach((item)=>{ const active=item===button; item.classList.toggle('is-active',active); item.setAttribute('aria-selected',String(active)); }); ['transactions','rules','report'].forEach((name)=>{ document.getElementById(`expense-${name}-panel`).style.display=name===operationsState.expenseTab?'block':'none'; }); }));
  document.getElementById('expense-report-fy')?.addEventListener('change',renderExpenseReport);
  document.getElementById('expense-export')?.addEventListener('click',async()=>{ const fy=Number(document.getElementById('expense-report-fy').value); const result=await operationsApi('api_exportExpenseReportCsv',{financial_year:fy}); const link=document.createElement('a'); link.href=URL.createObjectURL(new Blob([result.csv],{type:'text/csv;charset=utf-8'})); link.download=result.filename; link.click(); URL.revokeObjectURL(link.href); });

  async function renderBasLedgerSummary() {
    const target=document.getElementById('bas-ledger-summary');
    if(!target)return;
    const basisSelect=document.getElementById('bas-accounting-basis');
    const basis=(basisSelect&&basisSelect.value)||defaultAccountingBasis();
    if(basisSelect)basisSelect.value=basis;
    const now=new Date();
    const fy=Number(state.basCurrentFy)||financialYearStartYear(now);
    const calendarMonth=now.getMonth();
    const quarter=Math.floor(((calendarMonth+6)%12)/3)+1;
    const payload={financial_year:fy,period_type:state.companyBasQuarterly?'quarterly':'monthly',quarter:quarter,month:calendarMonth,accounting_basis:basis};
    try {
      const report=await operationsApi('api_calculateBasPeriod',payload);
      target.replaceChildren();
      [['Actual sales',report.actual.g1_total_sales],['GST on sales',report.actual.gst_on_sales],['GST credits',report.actual.gst_on_purchases],['Timesheet forecast',report.forecast.timesheet_income],['Scheduled expenses',report.forecast.scheduled_expenses],['Unpaid invoices',report.variance.unpaid_invoices],['Unreconciled expenses',report.variance.unreconciled_expenses]].forEach(([label,value])=>{const item=document.createElement('div');ledgerText(item,'ts-ledger-row__meta',label);const strong=document.createElement('strong');strong.textContent=operationsMoney(value);item.appendChild(strong);target.appendChild(item);});
      document.getElementById('bas-ledger-period').textContent=`${report.period.from} to ${report.period.to} · ${report.accounting_basis} basis`;
      document.getElementById('bas-ledger-warnings').textContent=(report.warnings||[]).join(' ');
    } catch(error) {
      target.textContent=error.message||'Could not calculate ledger actuals.';
    }
  }
  function soleTraderMode() {
    const flag=(state.featureFlags&&state.featureFlags.is_sole_trader)||(typeof DEFAULT_FEATURE_FLAGS!=='undefined'&&DEFAULT_FEATURE_FLAGS.is_sole_trader)||{enabled:false};
    return !!flag.enabled;
  }
  // A saved basis always wins; with nothing saved, sole traders report on an accrual basis.
  function defaultAccountingBasis() {
    return (state.settings&&state.settings.accounting_basis)||(soleTraderMode()?'accrual':'cash');
  }

  function transferSplitEnabled() {
    const flag=(state.featureFlags&&state.featureFlags.enable_lil_assessments_mode)||(typeof DEFAULT_FEATURE_FLAGS!=='undefined'&&DEFAULT_FEATURE_FLAGS.enable_lil_assessments_mode)||{enabled:false};
    return !!flag.enabled;
  }

  function transferSplitCell(row,value,options) {
    const cell=document.createElement('td');
    cell.style.textAlign=(options&&options.align)||'right';
    cell.textContent=(options&&options.text)!==undefined?options.text:operationsMoney(value);
    // A negative transfer means money comes back out of that account, so it must not read as a payment in.
    if((options&&options.text)===undefined&&Number(value)<0) cell.classList.add('ts-amount--negative');
    if(options&&options.strong) cell.style.fontWeight='600';
    row.appendChild(cell);
    return cell;
  }

  function renderTransferSplitRow(target,month,isTotal) {
    const row=document.createElement('tr');
    transferSplitCell(row,null,{text:isTotal?'Total':month.label,align:'left',strong:isTotal});
    transferSplitCell(row,null,{text:isTotal?'':'Q'+month.bas_quarter,align:'left'});
    [month.received,month.expenses_paid,month.net_gst,month.super,month.tax,month.to_business_account,month.to_offset]
      .forEach((value,index)=>transferSplitCell(row,value,{strong:isTotal||index>=5}));
    target.appendChild(row);
  }

  async function renderTransferSplit() {
    const section=document.getElementById('bas-transfer-split-section');
    if(!section) return;
    if(!transferSplitEnabled()){ section.style.display='none'; return; }
    const body=document.getElementById('bas-transfer-split-body');
    const foot=document.getElementById('bas-transfer-split-foot');
    const basisSelect=document.getElementById('bas-accounting-basis');
    const basis=(basisSelect&&basisSelect.value)||defaultAccountingBasis();
    const now=new Date();
    const fy=Number(state.basCurrentFy)||financialYearStartYear(now);
    section.style.display='block';
    try {
      const report=await operationsApi('api_getMonthlyTransferSplit',{financial_year:fy,accounting_basis:basis});
      operationsState.transferSplitFy=fy;
      body.replaceChildren();
      report.months.forEach((month)=>renderTransferSplitRow(body,month,false));
      foot.replaceChildren();
      renderTransferSplitRow(foot,report.totals,true);
      const method=document.getElementById('bas-transfer-split-method');
      method.textContent=report.tax_method==='instalment_rate'
        ? `Tax set aside using your PAYG instalment rate of ${(report.instalment_rate*100).toFixed(2)}% on gross business income. Sole trader: tax applies to profit, and super is deducted before it.`
        : 'Tax set aside from year-to-date profit at the annual rates, revised each month. A provisioning estimate, not an ATO assessment.';
      const warnings=document.getElementById('bas-transfer-split-warnings');
      warnings.replaceChildren();
      (report.warnings||[]).concat(report.tax_table&&report.tax_table.warning?[report.tax_table.warning]:[])
        .forEach((text)=>ledgerText(warnings,'ts-note',text));
    } catch(error) {
      body.replaceChildren();
      foot.replaceChildren();
      operationsStatus('Could not load the monthly transfer split: '+(error&&error.message?error.message:error),'warn');
    }
  }

  document.getElementById('bas-transfer-split-export')?.addEventListener('click',async()=>{
    const fy=operationsState.transferSplitFy;
    if(!fy) return;
    const basisSelect=document.getElementById('bas-accounting-basis');
    const basis=(basisSelect&&basisSelect.value)||defaultAccountingBasis();
    const result=await operationsApi('api_exportMonthlyTransferSplitCsv',{financial_year:fy,accounting_basis:basis});
    const link=document.createElement('a');
    link.href=URL.createObjectURL(new Blob([result.csv],{type:'text/csv;charset=utf-8'}));
    link.download=result.filename;
    link.click();
    URL.revokeObjectURL(link.href);
  });

  document.getElementById('bas-accounting-basis')?.addEventListener('change',async(event)=>{state.settings.accounting_basis=event.target.value;await operationsApi('api_updateSettings',{accounting_basis:event.target.value});renderBasLedgerSummary();renderTransferSplit();});
</script>
